// 제1당 안드로이드 앱
// - 게임 파일(public/jeildang, public/shared, privacy.html)을 빌드할 때 앱 안(assets/site)에 복사해 넣는다. 사이트에 배포해도 앱은 바뀌지 않는다.
//   게임을 고치면 versionCode 를 올려 다시 빌드·업로드한다.
// - 광고는 AdMob 하단 배너(게임 화면에서만). 동의 창은 Google UMP
// - Google 로그인은 Credential Manager 로 받은 토큰을 페이지의 Firebase 에 넘긴다(GOOGLE_WEB_CLIENT_ID 가 있을 때만)
apply plugin: 'com.android.application'

// ── 운영자가 채우는 값 ────────────────────────────────────────────
// AdMob 앱 ID 와 배너 광고 단위 ID (실제 값). 시험할 때 자기 폰에서 광고를 누르지 않는다(무효 클릭)
def ADMOB_APP_ID = 'ca-app-pub-5925323367833464~6629718334'
def ADMOB_BANNER_ID = 'ca-app-pub-5925323367833464/3750731563'
// Firebase 콘솔 → Authentication → 로그인 방법 → Google → 웹 SDK 구성의 '웹 클라이언트 ID'. 비어 있으면 앱에서는 이메일 로그인만 보인다
def GOOGLE_WEB_CLIENT_ID = ''
// ────────────────────────────────────────────────────────────

def siteDir = layout.buildDirectory.dir('siteAssets')
def copySite = tasks.register('copySite', Sync) {
    from(rootProject.file('../public')) {
        include 'jeildang/**', 'shared/**', 'privacy.html'
        exclude 'jeildang/play/**', 'jeildang/naver*', 'jeildang/sw.js', 'shared/og/**'
    }
    into siteDir.map { it.dir('site') }
}

android {
    namespace 'com.nihongodic.jeildang'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nihongodic.jeildang'
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName '1.1.3'
        manifestPlaceholders = [admobAppId: ADMOB_APP_ID]
        buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${ADMOB_BANNER_ID}\""
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${GOOGLE_WEB_CLIENT_ID}\""
    }
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs += siteDir } }
    buildTypes {
        release {
            // 코드 축소는 쓰지 않는다 (WebView 의 @JavascriptInterface 가 지워지면 게임이 앱 기능을 못 부른다)
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false }
}

preBuild.dependsOn copySite

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
