<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마이페이지 | nihongodic</title>
<meta name="description" content="nihongodic.com 사이트 공통 계정: Google·이메일 로그인, 마이페이지에서 이름 바꾸기와 Google 계정 연동.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c211d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23dfff70'%3E日%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#1c211d;--muted:#6c736b;--paper:#f8f7f2;--card:#fff;--line:#dcdcd3;--lime:#dfff70;--head:#f0eee5;--err:#b42318;--ok:#1d7a3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ecefe7;--muted:#9aa197;--paper:#151814;--card:#1c201b;--line:#343a32;--lime:#5f6e1f;--head:#22271f;--err:#ff8a7e;--ok:#7fd69a;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#ecefe7;--muted:#9aa197;--paper:#151814;--card:#1c201b;--line:#343a32;--lime:#5f6e1f;--head:#22271f;--err:#ff8a7e;--ok:#7fd69a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.7}
html[lang="ja"] body{font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{margin:0;color:var(--muted);font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.11em}
h1{margin:10px 0 18px;font-size:clamp(26px,6vw,34px);line-height:1.2;letter-spacing:-.03em;font-weight:900}
h2{margin:0 0 6px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;margin-bottom:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button,.btn{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:9px;padding:10px 14px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;text-align:center;display:inline-block}
button.ghost,.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
button.ghost:hover,.btn.ghost:hover{border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.g{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);color:var(--ink);border-color:var(--line)}
.g:hover{border-color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:none;color:var(--muted);border-color:var(--line)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.msg{margin:0;font-size:13px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.muted{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prov{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prov:first-of-type{border-top:0}
.prov b{font-size:14px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.link{background:none;border:0;padding:0;color:var(--muted);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<script src="/shared/nav.js"></script>
<main class="wrap">
  <p class="eyebrow">NIHONGODIC ACCOUNT</p>
  <h1 id="title"></h1>
  <div id="app"><p class="muted" id="loading"></p></div>
</main>
<script type="module">
// 사이트 공통 계정 페이지: 로그인(Google·이메일)과 마이페이지(이름, 로그인 수단, Google 연동, 로그아웃)
// ?next=/jeildang/ 처럼 오면 로그인한 뒤 그 주소로 돌아간다(같은 사이트 경로만).
import * as A from "/shared/account.js";

const L = (window.ND && ND.lang) || "ko", I = { ko: 0, ja: 1, en: 2 }[L] ?? 0;
const T = k => (TX[k] || [k])[I] ?? TX[k][0];
const TX = {
  login: ["로그인", "ログイン", "Log in"],
  mypage: ["마이페이지", "マイページ", "My page"],
  loading: ["계정 정보를 불러오는 중…", "アカウント情報を読み込み中…", "Loading your account…"],
  google: ["Google 계정으로 계속하기", "Googleアカウントで続ける", "Continue with Google"],
  or: ["또는 이메일", "またはメール", "or with email"],
  tabIn: ["이메일 로그인", "メールでログイン", "Log in"],
  tabUp: ["이메일로 가입", "メールで登録", "Sign up"],
  name: ["이름 (게임에서 보이는 이름)", "名前（ゲームで表示される名前）", "Name (shown in games)"],
  email: ["이메일", "メールアドレス", "Email"],
  pw: ["비밀번호 (6자 이상)", "パスワード（6文字以上）", "Password (6+ characters)"],
  doIn: ["로그인", "ログイン", "Log in"],
  doUp: ["가입하기", "登録する", "Create account"],
  forgot: ["비밀번호를 잊으셨나요?", "パスワードをお忘れですか？", "Forgot your password?"],
  resetSent: ["비밀번호 재설정 메일을 보냈어요. 메일함을 확인해 주세요.", "パスワード再設定メールを送りました。メールを確認してください。", "We sent a password reset email. Check your inbox."],
  needEmail: ["이메일 주소를 먼저 적어 주세요.", "先にメールアドレスを入力してください。", "Enter your email address first."],
  linkLater: ["이메일로 가입해도 나중에 마이페이지에서 Google 계정을 연동할 수 있어요.", "メールで登録しても、あとでマイページからGoogleアカウントを連携できます。", "Signed up with email? You can link your Google account later on My page."],
  profile: ["프로필", "プロフィール", "Profile"],
  save: ["저장", "保存", "Save"],
  saved: ["저장했어요.", "保存しました。", "Saved."],
  methods: ["로그인 수단", "ログイン方法", "Sign-in methods"],
  methodsNote: ["연동된 수단 중 아무것으로나 같은 계정에 로그인할 수 있어요. 게임 기록과 참가한 방은 계정에 묶여 있어요.", "連携した方法のどれでも同じアカウントにログインできます。ゲームの記録や参加した部屋はアカウントにひも付いています。", "Any linked method signs you in to the same account. Game history and rooms you joined stay with the account."],
  gName: ["Google", "Google", "Google"],
  pName: ["이메일·비밀번호", "メール・パスワード", "Email & password"],
  linked: ["연동됨", "連携済み", "Linked"],
  notLinked: ["연동 안 됨", "未連携", "Not linked"],
  linkGoogle: ["Google 계정 연동", "Googleアカウントを連携", "Link Google account"],
  linkedOk: ["Google 계정을 연동했어요.", "Googleアカウントを連携しました。", "Google account linked."],
  logout: ["로그아웃", "ログアウト", "Log out"],
  back: ["돌아가기", "戻る", "Go back"],
  signedAs: ["로그인됨", "ログイン中", "Signed in"],
};
document.title = `${T("mypage")} | nihongodic`;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const next = (() => { const n = new URLSearchParams(location.search).get("next") || ""; return /^\/(?!\/)[\w\-./?=&%]*$/.test(n) ? n : ""; })();
$("#loading").textContent = T("loading");

const G_ICON = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.2 44 33 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';
let mode = "in"; // in | up
let me;

function say(el, text, ok) { el.textContent = text || ""; el.className = "msg " + (ok ? "ok" : "err"); el.hidden = !text; }
const errText = e => A.errorText(e, L);

function renderLogin() {
  $("#title").textContent = T("login");
  $("#app").innerHTML = `
  <section class="card">
    <button class="g" id="g-btn">${G_ICON}<span>${T("google")}</span></button>
    <p class="msg" id="g-msg" hidden></p>
    <div class="or">${T("or")}</div>
    <div class="tabs" role="group"><button type="button" data-mode="in" aria-pressed="${mode === "in"}">${T("tabIn")}</button><button type="button" data-mode="up" aria-pressed="${mode === "up"}">${T("tabUp")}</button></div>
    <form id="e-form" class="card" style="margin:0;padding:0;border:0;background:none">
      ${mode === "up" ? `<label>${T("name")}<input id="e-name" maxlength="30" autocomplete="nickname"></label>` : ""}
      <label>${T("email")}<input id="e-mail" type="email" required autocomplete="email"></label>
      <label>${T("pw")}<input id="e-pw" type="password" required minlength="6" autocomplete="${mode === "up" ? "new-password" : "current-password"}"></label>
      <button type="submit" id="e-btn">${mode === "up" ? T("doUp") : T("doIn")}</button>
      <p class="msg" id="e-msg" hidden></p>
      ${mode === "in" ? `<button type="button" class="link" id="forgot">${T("forgot")}</button>` : `<p class="muted">${T("linkLater")}</p>`}
    </form>
  </section>`;
  $("#g-btn").onclick = async () => {
    say($("#g-msg"), "");
    try { await A.signIn(); } catch (e) { say($("#g-msg"), errText(e)); }
  };
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; renderLogin(); });
  $("#e-form").onsubmit = async ev => {
    ev.preventDefault();
    const btn = $("#e-btn"); btn.disabled = true; say($("#e-msg"), "");
    try {
      if (mode === "up") await A.signUpEmail($("#e-mail").value, $("#e-pw").value, $("#e-name").value);
      else await A.signInEmail($("#e-mail").value, $("#e-pw").value);
    } catch (e) { say($("#e-msg"), errText(e)); btn.disabled = false; }
  };
  const f = $("#forgot");
  if (f) f.onclick = async () => {
    const em = $("#e-mail").value.trim();
    if (!em) return say($("#e-msg"), T("needEmail"));
    try { await A.resetPassword(em); say($("#e-msg"), T("resetSent"), true); } catch (e) { say($("#e-msg"), errText(e)); }
  };
}

function renderMe(u) {
  $("#title").textContent = T("mypage");
  const has = id => u.providers.includes(id);
  $("#app").innerHTML = `
  <section class="card">
    <h2>${T("profile")}</h2>
    <p class="muted">${T("signedAs")}: ${esc(u.email || u.name)}</p>
    <label>${T("name")}<input id="m-name" maxlength="30" value="${esc(u.name)}"></label>
    <div class="row"><button id="m-save">${T("save")}</button><p class="msg" id="m-msg" hidden></p></div>
  </section>
  <section class="card">
    <h2>${T("methods")}</h2>
    <p class="muted">${T("methodsNote")}</p>
    <div>
      <div class="prov"><b>${T("gName")}</b>${has("google.com") ? `<span class="pill on">${T("linked")}</span>` : `<button class="g" id="m-link">${G_ICON}<span>${T("linkGoogle")}</span></button>`}</div>
      <div class="prov"><b>${T("pName")}</b><span class="pill ${has("password") ? "on" : ""}">${has("password") ? T("linked") : T("notLinked")}</span></div>
    </div>
    <p class="msg" id="l-msg" hidden></p>
  </section>
  <div class="row">${next ? `<a class="btn" href="${esc(next)}">${T("back")}</a>` : ""}<button class="ghost" id="m-out">${T("logout")}</button></div>`;
  $("#m-save").onclick = async () => {
    try { await A.updateName($("#m-name").value); say($("#m-msg"), T("saved"), true); } catch (e) { say($("#m-msg"), errText(e)); }
  };
  const lk = $("#m-link");
  if (lk) lk.onclick = async () => {
    lk.disabled = true; say($("#l-msg"), "");
    try { await A.linkGoogle(); say($("#l-msg"), T("linkedOk"), true); } catch (e) { say($("#l-msg"), errText(e)); lk.disabled = false; }
  };
  $("#m-out").onclick = () => A.signOut();
}

A.onUser(u => {
  const was = me; me = u;
  // 로그인 화면에서 막 로그인했고 돌아갈 곳이 있으면 그리로 보낸다
  if (u && was === null && next) { location.href = next; return; }
  if (u) renderMe(u); else renderLogin();
});
</script>
</body>
</html>
