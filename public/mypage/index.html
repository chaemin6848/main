<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>마이페이지 | nihongodic</title>
<meta name="description" content="nihongodic의 모든 도구 이용 현황을 한곳에서 봅니다.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c211d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff'%3E日%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* 메인 페이지와 같은 잉크·종이 팔레트. 위에 계정 카드, 아래에 도구별 현황 카드가 한 줄씩 쌓인다 */
:root{
  --ink:#1c211d; --muted:#6c736b; --paper:#f8f7f2; --card:#ffffff; --line:#dcdcd3;
  --lime:#dfff70; --sky:#9fd8ff; --coral:#ffb4a2; --lilac:#cdb9ff; --rose:#ffc2d8; --mint:#b8f0d2; --sand:#ffe3a3; --red:#c0392b; --ok:#2f8a4e;
  --sans:"Noto Sans KR","Noto Sans JP",system-ui,-apple-system,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#ecefe7; --muted:#9aa197; --paper:#151814; --card:#1d211c; --line:#343a32;
  --lime:#8fa82e; --sky:#3b7aa3; --coral:#a95f4f; --lilac:#7a62b8; --rose:#a3566f; --mint:#3f8a62; --sand:#a8862f; --red:#ff8a7e; --ok:#5fd39b; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
.shell{max-width:820px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h1{margin:6px 0 0;font-size:clamp(26px,6vw,38px);font-weight:900;letter-spacing:-.03em}
.lead{margin:0;color:var(--muted);font-size:14.5px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:18px;box-shadow:4px 4px 0 var(--accent,var(--line));display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.glyph{flex:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#1c211d;font-weight:900;font-size:19px}
.head h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.02em}
.head .go{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink)}
.src{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);padding:1px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;display:inline-block;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.sub{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.row:first-child{border-top:0;padding-top:0}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .nm a{color:inherit}
.row .vals{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row .det{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);min-width:2px}
.empty{color:var(--muted);font-size:14px;margin:0}
.list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.list li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;font-size:13.5px}
.list .dt{font-family:var(--mono);color:var(--muted)}
.k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.k.apply{background:#1f4fa8}.k.exam{background:#9a5b00}.k.res{background:#0f7a4a}
.acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:24px;font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct .who{min-width:0;display:grid}
.acct .who b{font-size:18px;overflow-wrap:anywhere}
.acct .who span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.btn{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border:1.5px solid var(--ink);border-radius:8px;background:none;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--paper)}
.acct .btn{margin-left:auto}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note.bad{color:var(--red)}
.nm-edit{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:420px}.nm-edit .nd-field{flex:1;min-width:160px}
.ways{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.ways>b{font-size:14px}
.way{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.way .ok{color:var(--ok);font-weight:700;font-size:13px}.way .muted{color:var(--muted);font-size:13px}
.note:empty{display:none}
/* 로그인 상자 (/shared/account.js loginForm) */
.nd-login,.nd-form{display:grid;gap:8px;max-width:360px}.nd-login *{box-sizing:border-box}
.nd-google,.nd-submit{font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer;border:1.5px solid var(--ink)}
.nd-google{background:var(--ink);color:var(--paper)}.nd-submit{background:none;color:var(--ink)}
.nd-google:disabled,.nd-submit:disabled{opacity:.6;cursor:default}
.nd-or{margin:4px 0 0;font-size:12px;color:var(--muted);text-align:center}
.nd-field{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.nd-field input{font:inherit;font-size:16px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:none;color:var(--ink);min-width:0}
.nd-agree{display:flex;gap:6px;align-items:flex-start;font-size:12px}.nd-agree input{margin:2px 0 0;flex:none}.nd-agree a{color:inherit}
.nd-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nd-link{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.nd-msg{margin:0;font-size:12px;color:var(--ok)}.nd-msg:empty{display:none}.nd-msg.bad{color:var(--red)}
.nd-note{margin:2px 0 0;font-size:11px;color:var(--muted)}
[hidden]{display:none!important}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer a{color:var(--muted)}
@media (max-width:520px){.card{padding:14px}.head .go{margin-left:auto}.acct .btn{margin-left:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:8px 10px}.stat b{font-size:19px}
  .row{grid-template-columns:minmax(0,1fr)}.row .vals{text-align:left}}
</style>
</head>
<body>
<script src="/shared/nav.js"></script>
<div class="shell">
  <header>
    <h1 id="t-h1">마이페이지</h1>
    <p class="lead" id="t-lead"></p>
  </header>
  <section class="card" id="acct" style="--accent:var(--line)"></section>
  <div id="tools" style="display:flex;flex-direction:column;gap:18px"></div>
  <footer><span id="t-foot"></span> <a href="/privacy.html" id="t-priv"></a><span id="t-foot2"></span></footer>
</div>
<script src="/alarm/data.js"></script>
<script src="/alarm/i18n.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
