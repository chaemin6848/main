<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --mine:#fbf4e3; --ink:#1d2129; --ink2:#5f6672; --line:#e1ded6;
  --accent:#8a5f0f; --on-accent:#ffffff; --gold:#b8860b; --bad:#b42318; --good:#16794c; --shade:rgba(15,20,30,.45);
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a; --card:#1b1e25; --mine:#2a2416; --ink:#e8e8ea; --ink2:#a0a6b1; --line:#2e323c;
  --accent:#e3b459; --on-accent:#1b1e25; --gold:#e3b459; --bad:#ff8a7e; --good:#5fd39a; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151a; --card:#1b1e25; --mine:#2a2416; --ink:#e8e8ea; --ink2:#a0a6b1; --line:#2e323c;
  --accent:#e3b459; --on-accent:#1b1e25; --gold:#e3b459; --bad:#ff8a7e; --good:#5fd39a; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1rem;letter-spacing:.03em;color:var(--accent);font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)}.small{font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:8px;padding:8px 16px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 10px;font-size:13px;white-space:nowrap}
.btn.xs{padding:2px 7px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink2);white-space:nowrap}
.pill.gold{border-color:var(--gold);color:var(--gold);font-weight:700}
.chip{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 4px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;background:var(--c)}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:baseline}
/* 첫 화면 */
.hero{display:grid;gap:6px;margin-bottom:18px}
.badge{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:4px solid var(--gold);color:var(--gold);font-weight:700;font-size:13px;flex:none}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.choice{display:grid;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--mine);box-shadow:inset 0 0 0 1px var(--accent)}
.choice b{font-size:14px}.choice span{font-size:12px;color:var(--ink2)}
/* 내 상태 */
.me-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.me-head .who{display:grid;gap:2px;min-width:0}
.me-head .title{font-size:1.15rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
.stat{display:grid;gap:3px;font-size:13px}
.stat .top{display:flex;justify-content:space-between;gap:6px}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--bad)}
.d{font-size:11px;margin-left:3px}
/* 활동 */
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.slot.empty{color:var(--ink2);border-style:dashed}
.slot .params{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:4px}
.slot select,.slot input{font-size:14px;padding:6px 8px}
.x{background:none;border:none;font-size:18px;color:var(--ink2);padding:0 4px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.act{display:grid;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.act b{font-size:13px;display:flex;justify-content:space-between;gap:6px}.act b em{font-style:normal;font-weight:400;color:var(--ink2);font-size:12px}
.act span{font-size:12px;color:var(--ink2)}
.act:disabled{opacity:.45;cursor:not-allowed}
/* 사건 */
.event{border:2px solid var(--gold);background:var(--mine)}
.event .opts{display:grid;gap:6px}
.event .opts button{text-align:left;display:grid;gap:2px}
.event .opts button span{font-weight:400;font-size:12px;opacity:.85}
/* 표결 */
.bill{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.bill:first-of-type{border-top:none;padding-top:0}
.vote{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* 정국 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
tr.mine td{background:var(--mine)}
.scroll{overflow-x:auto}
.seatbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.seatbar i{display:block;height:100%;background:var(--c)}
.timeline{display:grid;gap:4px;font-size:13px;max-height:260px;overflow:auto}
.timeline div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:6px}
/* 결과 창 */
#modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;padding:16px;z-index:50}
#modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px;display:grid;gap:12px}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<script src="/shared/nav.js" data-langs="ko"></script>
<div class="wrap" id="app"></div>
<div id="modal" hidden></div>
<script src="/jeildang/engine.js"></script>
<script>
/* 금배지: 제1당 엔진(E)이 돌리는 세계에서 정치인 한 사람을 맡는다.
   세계(정당·선거·국회)는 E.resolveRound가 그대로 처리하고, 이 파일은 개인의 경력·활동·사건과
   그 사람이 맡은 자리(원내대표·당대표·총리 등)에 따라 우리 당의 결정을 대신 정해 넘기는 일만 한다. */
const SAVE_KEY='geumbaeji-v1';
const COLORS=['#1F6FB2','#C93A2B','#16875A','#B98500','#7A4FC0','#0B8A8F','#C4477F','#7D6238'];
const pColor=p=>p.color||COLORS[p.colorIdx]||COLORS[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=()=>Math.random();
const pick=a=>a[Math.floor(rnd()*a.length)];
const chip=p=>`<span class="chip" style="--c:${pColor(p)}">${p.no}</span>`;
const sign=n=>n>0?'+'+n:String(n);

/* ---------- 고정 자료 ---------- */
const BACKGROUNDS={
  lawyer:{name:'변호사',desc:'법을 알아 법안을 잘 만듭니다.',s:{fame:30,local:40,standing:40,expert:58,integrity:55,money:4}},
  activist:{name:'시민운동가',desc:'깨끗하고 이름이 조금 알려져 있습니다.',s:{fame:42,local:45,standing:33,expert:40,integrity:72,money:2}},
  official:{name:'관료',desc:'행정을 알고 당이 믿고 씁니다.',s:{fame:24,local:35,standing:46,expert:64,integrity:56,money:3}},
  business:{name:'기업인',desc:'돈이 많지만 의심도 받습니다.',s:{fame:30,local:40,standing:40,expert:45,integrity:44,money:10}},
  anchor:{name:'방송인',desc:'얼굴이 알려져 있지만 정책은 약합니다.',s:{fame:60,local:38,standing:34,expert:30,integrity:50,money:4}},
  local:{name:'지역 토박이',desc:'지역구 기반이 탄탄합니다.',s:{fame:24,local:66,standing:45,expert:36,integrity:55,money:4}},
};
const STATS=[['fame','인지도'],['local','지역 기반'],['standing','당내 입지'],['expert','전문성'],['integrity','청렴'],['energy','체력']];
// 직위와 경력 점수. 표시는 가장 높은 것 하나.
const POSTS={president:['대통령',80],pm:['총리',75],leader:['당대표',50],whip:['원내대표',35],minister:['장관',28],chair:['상임위원장',20],spokes:['대변인',15]};
const ACTS={
  local:{label:'지역구 순회',energy:14,desc:'지역 기반 +6. 기반이 두터울수록 덜 오릅니다.'},
  serve:{label:'민원 해결·봉사',energy:10,money:1,desc:'지역 기반 +3, 청렴 +2'},
  media:{label:'방송 출연',energy:12,desc:'인지도 +5. 15% 확률로 설화(입지 −5)'},
  attack:{label:'상대 당 저격 논평',energy:8,need:'target',desc:'인지도 +3, 입지 +2, 상대 당 신뢰 −1. 20% 확률로 역풍(청렴 −3)'},
  study:{label:'정책 연구',energy:10,desc:'전문성 +5'},
  bill:{label:'법안 대표발의',energy:15,need:'bill',seat:true,desc:'우리 당 몫으로 다음 분기 본회의에 법안을 올립니다. 가결되면 실적이 쌓입니다.'},
  faction:{label:'계파 모임',energy:10,money:1,seat:true,desc:'당내 입지 +4, 같은 계파 의원 모두와 관계 +4 (무계파면 아무 의원 8명과 +3)'},
  woo:{label:'의원과 식사',energy:8,money:1,need:'member',desc:'고른 의원과 관계 +12. 이미 가까울수록 덜 오릅니다.'},
  deal:{label:'협상',energy:8,need:'deal',desc:'의원 한 사람과 거래합니다: 동지 맺기, 다른 당 의원 영입, 계파 지지 거래, 내 계파로 영입.'},
  endorse:{label:'지지 선언 요청',energy:6,need:'member',desc:'관계가 좋을수록 잘 됩니다. 성공하면 다음 당내 선거에서 그 의원과 같은 계파 의원들이 우리 쪽으로 기웁니다.'},
  donate:{label:'특별당비 납부',energy:0,money:3,desc:'당 자금 +3, 입지 +4'},
  fund:{label:'후원회 개최',energy:12,desc:'정치자금 +(3 + 인지도/20), 청렴 −1'},
  rest:{label:'휴식',energy:-35,desc:'체력 +35'},
};
const AP=3;
// 당대표 화면에서 직접 고르지 않는 당 행동(따로 입력이 필요하거나 금배지의 전당대회·대표발의와 겹친다). 참모 건의로 들어오면 그대로 둔다.
const PACT_HIDE=['leaveFed','expel','propose','shift','amendBill','leaderRace'];
const GOV_HIDE=['amend'];
const SURNAMES='김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구민진나지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용예경봉사부황보'.split('');
const GIVEN='민준 서연 도윤 지우 하준 서윤 시우 지민 주원 수아 예준 하은 건우 윤서 현우 지유 우진 채원 선우 지아 정훈 은정 상철 미경 영수 혜진 동현 수진 재석 경희 태호 나연 성민 유나 진호 소영 준혁 다은 석진 보람'.split(' ');

/* ---------- 상태 ---------- */
let G=null;           // 저장되는 게임 전체
let SETUP=null;       // 시작 화면 고른 값
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
const W=()=>G.world;
const myParty=()=>E.party(W(),G.me.party);
const fedOf=p=>E.fedOf(W(),p);
const sysName=()=>({presidential:'대통령제',semi:'이원집정부제',westminster:'의원내각제',parliament:'의원내각제'})[W().system]||'의원내각제';
const isPresSys=()=>W().system==='presidential';
const hasPres=()=>W().system==='presidential'||W().system==='semi';
const seated=()=>G.me.seat; // 지금 의원인가(원외가 아닌가)
const leader=()=>!!G.me.posts.leader;
const whip=()=>!!G.me.posts.whip;
// 정부 수반인가: 대통령제는 대통령으로 뽑혔을 때, 그 밖에는 당대표이면서 우리 당이 총리를 냈을 때
function headRole(){
  const g=W(),p=myParty();
  if(G.me.posts.president&&(isPresSys()?g.pmParty===p.id:g.presParty===p.id))return'president';
  // 총리는 의원만 맡는다. 원외 당대표면 우리 당 몫의 총리는 다른 의원이 맡는다.
  if(!isPresSys()&&leader()&&seated()&&g.pmParty===p.id)return'pm';
  return null;
}
// 행정 조치를 직접 정하는가: 수반이거나, 우리 당이 정부를 이끌지 않는 연립 정당의 당대표일 때
function fullGov(){const g=W(),p=myParty();return!!headRole()||(leader()&&g.pmParty!==p.id&&g.presParty!==p.id)}
function titleOf(){
  const h=headRole();if(h)return POSTS[h][0];
  for(const k of['leader','whip','minister','chair','spokes'])if(G.me.posts[k])return POSTS[k][0];
  const t=seated()?(G.me.terms===1?'초선 의원':`${G.me.terms}선 의원`):'원외 인사';
  return isIndep()?'무소속 '+t:t;
}
function postScore(){const h=headRole();if(h)return POSTS[h][1];let s=seated()?10:4;for(const k in POSTS)if(G.me.posts[k])s=Math.max(s,POSTS[k][1]);return s}
function govSlots(){return E.govSlots(W(),myParty())}
function stat(k,d){const s=G.me.stats;s[k]=clamp(Math.round((s[k]+d)*10)/10,0,k==='money'?999:100);G.turn.d[k]=(G.turn.d[k]||0)+d}
function note(text,kind){G.turn.notes.push({text,kind:kind||''})}
// 분기 처리 중에는 방금 치른 분기 번호로 남긴다(세계는 이미 다음 분기로 넘어가 있다).
function milestone(text){G.me.timeline.unshift({round:G.atRound||W().round,text})}

/* ---------- 새 게임 ---------- */
function makeWorld(country,rounds,seed){
  return E.newGame({players:[],size:6,seed,rounds,timer:0,now:Date.now(),country:country||null});
}
function setupDefaults(){
  const seed=Math.floor(Math.random()*2**31);
  SETUP={name:'',bg:'lawyer',country:'',rounds:24,seed,party:null,region:null};
  refreshSetupWorld();
}
function refreshSetupWorld(){
  SETUP.world=makeWorld(SETUP.country,SETUP.rounds,SETUP.seed);E.useMap(SETUP.world);
  const ps=SETUP.world.parties.filter(p=>!p.fixed);
  if(!ps.some(p=>p.id===SETUP.party))SETUP.party=ps.slice().sort((a,b)=>b.seats-a.seats)[0].id;
  if(!E.REGIONS.some(r=>r.id===SETUP.region))SETUP.region=bestRegion(SETUP.world,SETUP.party);
}
function bestRegion(g,pid){
  const fc=E.electionSeats(g);return fc.regions.slice().sort((a,b)=>(b.seats[pid]||0)/E.REG[b.id].seats-(a.seats[pid]||0)/E.REG[a.id].seats)[0].id;
}
function startGame(){
  const g=SETUP.world;E.useMap(g);
  const p=E.party(g,SETUP.party);
  p.ownerId='me';
  const b=BACKGROUNDS[SETUP.bg];

      stats:{...b.s,energy:100},posts:{},bills:0,billsPassed:0,defy:[],dirty:0,timeline:[],peak:10,over:null,cutoff:false,indep:false,wing:SETUP.wing||'n'},

  { const fs=facsOf(p.id).filter(f=>f.wing===G.me.wing);if(fs.length){const pw=facPower(p.id);const f=fs.sort((a,b)=>pw[b.id]-pw[a.id])[0];G.me.fac=f.id}else G.me.wing=NONE }

/* ---------- 분기 준비: 이번 분기에 답해야 할 사건 ---------- */
function newTurn(){G.turn={d:{},notes:[],world:[]};G.draft=freshDraft()}
// 우리 당의 기본안: AI가 우리 당을 운영했다면 냈을 결정. 같은 분기에는 늘 같은 값이 나온다.
function baseMove(){
  const g=W(),p=myParty();
  const mv=E.botMove(g,p,E.rng((g.seed*31+g.round*977)>>>0));
  return E.sanitize(g,p,mv);
}
function freshDraft(){
  const b=baseMove();
  return{acts:[],myVotes:{},partyVotes:{...b.votes},partyActs:b.actions.map(a=>({...a})),pm:b.pm,gov:b.gov.map(a=>({...a})),govBill:b.bill,deals:[],replies:{},round:W().round};

// 당내 선거 점수
/* ---------- 당내 정치: 의원 명부·계파·관계·당내 선거 ----------
   우리 당 의원(나 빼고)은 한 사람씩 G.roster에 이름·계파·선수·영향력을 갖고 있다. 계파는 엔진의 p.wings(a·b)와 같고,
   어느 쪽에도 속하지 않은 의원은 무계파('n')다. G.rel[의원 id]는 그 의원과 나의 관계(−50~+50).
   G.lead·G.whipId는 당대표·원내대표가 누구인지('me' 또는 의원 id). 엔진의 p.leader 이름은 G.lead에 맞춘다. */
const NONE='n';
const wingsOf=p=>p.wings&&p.wings.length?p.wings:[{id:'a',name:'혁신파',power:50,de:0,ds:0},{id:'b',name:'안정파',power:50,de:0,ds:0}];
const wingName=(id,p)=>{if(!id||id===NONE)return'무계파';const w=wingsOf(p||myParty()).find(x=>x.id===id);return w?w.name:'무계파'};
const wingLean=w=>[w.de>.04?'분배':w.de<-.04?'시장':'',w.ds>.04?'개방':w.ds<-.04?'전통':''].filter(Boolean).join('·')||'당 노선 그대로';
const member=id=>(G.roster||[]).find(m=>m.id===id)||null;
const rel=id=>Math.round((G.rel||{})[id]||0);
function addRel(id,d){G.rel[id]=clamp(((G.rel||{})[id]||0)+d,-50,50)}
function relWing(w,d){for(const m of G.roster)if(m.wing===w)addRel(m.id,d)}
const personName=id=>id==='me'?G.me.name:(member(id)||{name:'?'}).name;
// 두 의원 사이의 정해진 호불호(−8~+8). 같은 짝이면 늘 같은 값이다.
function affinity(a,b){let h=0;const s=a<b?a+b:b+a;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%17-8}
// 다른 당 명부: G.others[당 id] = {list, lead, whip}. 무소속·기타 묶음은 계파와 지도부가 없다.
const othersList=()=>Object.values(G.others||{}).flatMap(o=>o.list);
const findMember=id=>member(id)||othersList().find(m=>m.id===id)||null;
function partyOfMember(id){if(member(id))return myParty();for(const pid in G.others||{})if(G.others[pid].list.some(m=>m.id===id))return E.party(W(),pid);return null}
function mkMember(p,terms,mine=true,extra){
  const ws=wingsOf(p);
  const wing=p.fixed||rnd()<.12?NONE:(rnd()*100<ws[0].power?ws[0].id:ws[1].id);
  terms=terms||1+Math.floor(rnd()*rnd()*5);
  // 이름은 국회 전체에서 겹치지 않게 짓는다.
  const used=G.names||(G.names={});
  let name,k=0;do{name=newName();if(++k>60)name+=' '+k}while(used[name]||name===G.me.name);used[name]=1;
  const m={id:'m'+(G.mseq=(G.mseq||0)+1),name,wing,terms,clout:clamp(Math.round(terms*9+rnd()*25),5,95),region:pick(E.REGIONS).id};
  assignFac(p,m);
  G.rel[m.id]=mine?Math.round(rnd()*14-5)+(m.fac&&m.fac===G.me.fac?10:m.wing!==NONE&&m.wing===G.me.wing?4:0):Math.round(rnd()*10-6);
  return m;
}
// 당대표는 영향력이 가장 큰 의원, 원내대표는 다른 계파에서 가장 큰 의원으로 시작한다.
function pickHeads(p,o){
  if(p.fixed||!o.list.length){o.lead=null;o.whip=null;return}
  const top=o.list.slice().sort((a,b)=>b.clout-a.clout);
  if(!o.lead||!o.list.some(m=>m.id===o.lead))o.lead=top[0].id;
  const L=o.list.find(m=>m.id===o.lead);
  if(!o.whip||!o.list.some(m=>m.id===o.whip)){const w=top.find(m=>m.id!==o.lead&&m.wing!==L.wing)||top.find(m=>m.id!==o.lead);o.whip=w?w.id:null}
  p.leader=L.name;
}
function buildOther(p){const o={list:[],lead:null,whip:null};while(o.list.length<p.seats)o.list.push(mkMember(p,0,false));pickHeads(p,o);return o}
// 예전 저장 판: 계파가 없으면 만들고, 의원을 계열에 맞춰 계파에 넣는다.
function migrateFacs(){
  G.facs=G.facs||{};if(G.me.fac===undefined)G.me.fac=null;
  for(const p of W().parties){ensureFacs(p);for(const m of listOf(p.id))if(m.fac===undefined)assignFac(p,m)}
}
function initOthers(){
  G.others=G.others||{};
  for(const p of W().parties)if(p.id!==G.me.party&&!G.others[p.id])G.others[p.id]=buildOther(p);
}
// 명부를 의석에 맞춘다(총선 뒤에는 선수가 오르고 일부가 물러난다). keep에 든 의원은 지킨다.
function fitList(list,p,target,election,keep,mine){
  const drop=n=>{for(let i=0;i<n&&list.length;i++){
    const pool=list.filter(m=>!keep.includes(m.id));if(!pool.length)break;
    const w=pool.map(m=>1/(m.clout+10));const t=rnd()*w.reduce((a,b)=>a+b,0);let k=0;for(let s=0;k<pool.length-1&&(s+=w[k])<t;k++);
    const out=pool[k];list.splice(list.indexOf(out),1);delete G.rel[out.id];if(G.endorse)delete G.endorse[out.id];if(G.names)delete G.names[out.name];
  }};
  if(election){list.forEach(m=>{m.terms++;m.clout=clamp(m.clout+3,5,95)});drop(Math.round(list.length*.12))}
  if(list.length>target)drop(list.length-target);
  while(list.length<target)list.push(mkMember(p,1,mine));
}
const rosterTarget=()=>Math.max(0,myParty().seats-(G.me.seat?1:0));
// 계파 수장: 그 계파에서 영향력이 가장 큰 의원
function setLead(id){
  G.lead=id;G.me.posts.leader=id==='me';if(id==='me')G.me.posts.whip=false;
  if(G.whipId===id)G.whipId=null;
  myParty().leader=personName(id);
}
function initCaucus(){
  G.roster=[];G.rel=G.rel||{};G.endorse={};G.conv=null;initOthers();
  if(!G.me.wing)G.me.wing=NONE;
  const p=myParty();
  while(G.roster.length<rosterTarget())G.roster.push(mkMember(p));
  const top=G.roster.slice().sort((a,b)=>b.clout-a.clout);
  if(G.me.posts.leader)G.lead='me';else if(top[0])setLead(top[0].id);
  if(G.me.posts.whip)G.whipId='me';else{const w=top.find(m=>m.id!==G.lead&&m.wing!==(member(G.lead)||{}).wing)||top.find(m=>m.id!==G.lead);G.whipId=w?w.id:null}
}
// 의석에 맞춰 명부를 늘리고 줄인다. 총선 뒤에는 살아남은 의원의 선수가 오르고 일부는 물러난다.
function syncRoster(election){
  const p=myParty(),target=rosterTarget();
  fitList(G.roster,p,target,election,[G.lead,G.whipId],true);
  // 다른 당 명부도 의석에 맞춘다.
  initOthers();
  for(const pid in G.others){
    const q=E.party(W(),pid);if(!q||pid===p.id){delete G.others[pid];continue}
    const o=G.others[pid];fitList(o.list,q,q.seats,election,[o.lead,o.whip],false);
    for(const m of o.list)m.clout=clamp(m.clout+(m.id===o.lead?2:m.id===o.whip?1:0)+(rnd()-.5)*2,5,95);
    pickHeads(q,o);
  }
  // 영향력은 조금씩 오르내리고, 자리에 있으면 오른다.
  for(const m of G.roster)m.clout=clamp(m.clout+(m.id===G.lead?2:m.id===G.whipId?1:0)+(rnd()-.5)*2,5,95);
  for(const k in G.rel)G.rel[k]*=.97;
  if(p.fixed){G.lead=null;G.whipId=null}
  else if(G.lead!=='me'&&!member(G.lead)){const t=G.roster.slice().sort((a,b)=>b.clout-a.clout)[0];if(t){setLead(t.id);note(`당대표 자리가 비어 ${t.name} 의원이 권한대행을 맡았습니다.`);G.next.conv=Math.min(G.next.conv,W().round+1)}}
  if(G.whipId&&G.whipId!=='me'&&!member(G.whipId))G.whipId=null;
  if(G.lead==='me')p.leader=G.me.name;
}
// 의원 m이 후보 c를 얼마나 미는가
function leanTo(m,c,ctx){
  if(c.id===m.id)return 999;
  let s=c.clout*.25+(rnd()-.5)*14;
  if(c.id==='me'){
    if((ctx.endorse||{})[m.id])s+=60;if(m.ally)s+=40;
    s+=rel(m.id)+(m.fac&&m.fac===G.me.fac?22:m.wing!==NONE&&m.wing===G.me.wing?8:0);
    for(const e in ctx.endorse||{}){const b=member(e);if(b&&b.fac&&b.fac===m.fac)s+=12}
    if(ctx.pacts&&m.fac&&ctx.pacts[m.fac])s+=15;
  }else{s+=(m.fac&&m.fac===c.fac?28:m.wing!==NONE&&m.wing===c.wing?8:m.wing===NONE||c.wing===NONE?0:-6)+affinity(m.id,c.id);if(ctx.support===c.id&&rel(m.id)>=15)s+=12}
  return s;
}
function memberVotes(cands,ctx,list){
  const tally=Object.fromEntries(cands.map(c=>[c.id,0]));
  for(const m of list||G.roster){let best=null,bs=-1e9;for(const c of cands){const s=leanTo(m,c,ctx);if(s>bs){bs=s;best=c.id}}tally[best]++}
  if(!list&&seated()&&ctx.myVote&&tally[ctx.myVote]!=null)tally[ctx.myVote]++;
  return tally;
}
// 당원 여론: 인지도·영향력과 계파 세력으로 정한다.
function partyPoll(cands,p){
  const ws=wingsOf(p||myParty()),s=G.me.stats;
  const pop=c=>Math.max(5,c.id==='me'?s.fame*.5+s.integrity*.2+s.standing*.3:c.clout*.6+18+(ws.find(w=>w.id===c.wing)||{power:0}).power*.25)*(1+(rnd()-.5)*.25);
  const v=cands.map(c=>Math.pow(pop(c),2)),sum=v.reduce((a,b)=>a+b,0);
  return Object.fromEntries(cands.map((c,i)=>[c.id,v[i]/sum]));
}
const cand=id=>id==='me'?{id:'me',name:G.me.name,wing:G.me.wing,fac:G.me.fac,clout:Math.round(G.me.stats.standing*.6+G.me.terms*6)}:{...member(id)};
function tallyHtml(rows,cols){
  return`<div class="scroll"><table><thead><tr><th>후보</th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.id==='me'?'mine':''}"><td>${esc(r.name)} <span class="small muted">${esc(facName(r.fac))}</span>${r.win?' <b class="good">당선</b>':''}</td>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
// 전당대회 예고: 다음 분기에 표결한다. 후보가 정해지고, 그 사이 의원을 만나 표를 모을 수 있다.
function announceConv(){
  const g=W(),me=G.me;
  const ids=[];
  if(G.lead!=='me'&&member(G.lead))ids.push(G.lead);
  for(const b of topBosses(G.me.party,3))if(!ids.includes(b)&&ids.length<3)ids.push(b);
  if(ids.length<2){const t=G.roster.filter(m=>!ids.includes(m.id)).sort((a,b)=>b.clout-a.clout)[0];if(t)ids.push(t.id)}
  G.conv={round:g.round+1,cands:ids.slice(0,3),meRun:false,support:null};
  const inc=leader();
  const list=G.conv.cands.map(id=>{const m=member(id);return`<li>${esc(m.name)} — ${esc(facName(m.fac))}${isBoss(m)?' 수장':''}, ${m.terms}선, 영향력 ${Math.round(m.clout)}${id===G.lead?', 현 대표':''}${m.ally?', 나의 동지':''} · 나와의 관계 ${sign(rel(id))}</li>`}).join('');
  addEvent({type:'convAnn',title:'전당대회 예고',text:`다음 분기에 ${myParty().name} 전당대회가 열립니다. 의원 투표 50%와 당원 여론조사 50%로 당대표를 뽑고, 과반 후보가 없으면 상위 두 사람이 결선을 치릅니다.`,
    html:`<ul class="small">${list}</ul>`,
    opts:[['run',inc?'연임에 도전한다':'당대표에 출마한다','체력 −10. 이번 분기에 의원을 만나 표를 모으세요.'],
      ...G.conv.cands.map(id=>['sup:'+id,`${member(id).name} 후보를 지지한다`,'이기면 입지와 관계가 오르고, 지면 깎입니다. 나와 가까운 의원들이 따라 움직입니다.']),
      ['none',inc?'불출마하고 중립을 지킨다':'중립을 지킨다','']]});
}
function holdConv(){
  const C=G.conv,me=G.me,p=myParty();G.conv=null;G.next.conv=W().round+8;
  const ids=C.cands.filter(id=>member(id)).concat(C.meRun?['me']:[]);
  if(!ids.length)return;
  let cands=ids.map(cand);
  const ctx={endorse:C.meRun?G.endorse:{},pacts:C.meRun?G.pacts:null,support:C.support,myVote:C.meRun?'me':C.support};
  const run=cs=>{const mv=memberVotes(cs,ctx),poll=partyPoll(cs),tot=Object.values(mv).reduce((a,b)=>a+b,0)||1;
    return cs.map(c=>({...c,mv:mv[c.id],ms:mv[c.id]/tot,poll:poll[c.id],score:mv[c.id]/tot*.5+poll[c.id]*.5})).sort((a,b)=>b.score-a.score)};
  let r1=run(cands),r2=null,win=r1[0];
  if(r1.length>=3&&r1[0].score<.5){r2=run([r1[0],r1[1]]);win=r2[0]}
  (r2||r1)[0].win=true;
  const cols=[['의원 표',r=>r.mv],['의원 %',r=>(r.ms*100).toFixed(1)],['당원 %',r=>(r.poll*100).toFixed(1)],['합산 %',r=>`<b>${(r.score*100).toFixed(1)}</b>`]];
  let html=`<h3>1차 투표</h3>${tallyHtml(r1,cols)}`;if(r2)html+=`<h3>결선</h3>${tallyHtml(r2,cols)}`;
  const was=G.lead;setLead(win.id);
  // 이긴 쪽 계파 세력이 커진다(엔진의 계파 세력과 같은 값).
  const ws=wingsOf(p);const W1=ws.find(w=>w.id===win.wing);if(W1&&p.wings){W1.power=clamp(W1.power+8,20,80);for(const o of p.wings)if(o!==W1)o.power=100-W1.power}
  let text;
  if(win.id==='me'){stat('fame',6);stat('standing',5);milestone(was==='me'?'당대표 연임에 성공했습니다.':`${p.name} 당대표에 선출됐습니다.`);text=was==='me'?'연임에 성공했습니다.':'당대표에 선출됐습니다!'}
  else{
    if(C.meRun){stat('standing',-4);addRel(win.id,-6);text=`${win.name} 후보에게 졌습니다.`;if(was==='me')milestone('전당대회에서 패해 당대표에서 물러났습니다.')}
    else if(C.support){const ok=C.support===win.id;stat('standing',ok?4:-3);addRel(win.id,ok?6:-6);text=ok?`지지한 ${win.name} 후보가 이겼습니다.`:`지지한 후보가 지고 ${win.name} 후보가 당대표가 됐습니다.`}
    else text=`${win.name} 후보가 당대표가 됐습니다.`;
    if(was==='me'&&!C.meRun)milestone('당대표에서 물러났습니다.');
  }
  // 계파 지지 거래: 이겼으면 약속대로 그 계파 수장에게 원내대표를 맡긴다.
  if(win.id==='me'){const ids=Object.values(G.pacts||{}).filter(id=>member(id));if(ids.length){G.whipId=ids[0];text+=` 약속대로 ${member(ids[0]).name} 의원이 원내대표를 맡습니다.`;addRel(ids[0],8)}}
  G.endorse={};G.pacts={};
  addEvent({type:'info',title:'전당대회 결과',text,html});
}
// 다른 당 전당대회: 당마다 8분기 간격(당 번호로 시기를 엇갈리게)으로 치른다. 결과는 분기 결과의 '다른 당 소식'에 나온다.
function otherConventions(round){
  for(const pid in G.others||{}){
    const p=E.party(W(),pid),o=G.others[pid];
    if(!p||p.fixed||o.list.length<3||(round+p.no*3)%8!==0)continue;
    const ids=[];if(o.lead)ids.push(o.lead);
    for(const b of topBosses(pid,3))if(!ids.includes(b))ids.push(b);
    if(ids.length<2)continue;
    const cs=ids.slice(0,3).map(id=>({...o.list.find(m=>m.id===id)}));
    const mv=memberVotes(cs,{},o.list),poll=partyPoll(cs,p),tot=o.list.length;
    const r=cs.map(c=>({...c,score:mv[c.id]/tot*.5+poll[c.id]*.5})).sort((a,b)=>b.score-a.score);
    const win=r[0],again=win.id===o.lead;o.lead=win.id;if(o.whip===win.id)o.whip=null;pickHeads(p,o);
    const W1=wingsOf(p).find(w=>w.id===win.wing);if(W1&&p.wings){W1.power=clamp(W1.power+8,20,80);for(const x of p.wings)if(x!==W1)x.power=100-W1.power}
    world(`${p.name} 전당대회: ${win.name} 의원(${facName(win.fac)}) ${again?'연임':'당대표 선출'} · 합산 ${(win.score*100).toFixed(0)}%`);
  }
}

// 원내대표 선거: 의원만 투표한다. 곧바로 결과가 나온다.
function whipCands(){
  const leadWing=G.lead==='me'?G.me.wing:(member(G.lead)||{}).wing;
  const pool=G.roster.filter(m=>m.id!==G.lead).sort((a,b)=>b.clout-a.clout);
  const ids=[];for(const w of wingsOf(myParty())){const t=pool.find(m=>m.wing===w.id&&!ids.includes(m.id));if(t)ids.push(t.id)}
  if(G.whipId&&G.whipId!=='me'&&member(G.whipId)&&!ids.includes(G.whipId))ids.unshift(G.whipId);
  if(ids.length<2){const t=pool.find(m=>!ids.includes(m.id));if(t)ids.push(t.id)}
  return ids.slice(0,3);
}
function announceWhip(){
  const ids=whipCands();G.whipCands=ids;
  const list=ids.map(id=>{const m=member(id);return`<li>${esc(m.name)} — ${esc(facName(m.fac))}, ${m.terms}선, 영향력 ${Math.round(m.clout)} · 나와의 관계 ${sign(rel(id))}</li>`}).join('');

    opts:[['run',whip()?'연임에 도전한다':'출마한다','체력 −8. 같은 계파와 나와 가까운 의원이 표를 줍니다.'],...ids.map(id=>['sup:'+id,`${member(id).name} 의원을 지지한다`,'']),['none','나서지 않는다','']]});

function runWhip(key){
  const me=G.me;const ids=(G.whipCands||whipCands()).filter(id=>member(id));
  const meRun=key==='run',support=key.startsWith('sup:')?key.slice(4):null;
  if(meRun)stat('energy',-8);
  const cs=ids.map(cand).concat(meRun?[cand('me')]:[]);
  const mv=memberVotes(cs,{support,myVote:meRun?'me':support});
  const rows=cs.map(c=>({...c,mv:mv[c.id]})).sort((a,b)=>b.mv-a.mv);rows[0].win=true;
  const win=rows[0],was=G.whipId;
  G.whipId=win.id;me.posts.whip=win.id==='me';
  let res;

  return{res,html:tallyHtml(rows,[['의원 표',r=>`<b>${r.mv}</b>`]])};
}

    s:'마르탱 베르나르 뒤부아 토마 로베르 리샤르 프티 뒤랑 르루아 모로 시몽 로랑 르페브르 미셸 가르시아 다비드 베르트랑 루 뱅상 푸르니에 모렐 지라르 앙드레 메르시에 뒤퐁 랑베르 보네 프랑수아 마르티네즈 르그랑 가르니에 포르 루소 블랑 게랭 뮐레르 앙리 루셀 니콜라 페랭 모랭 클레망 고티에 뒤몽 로페즈 퐁텐 슈발리에 로비네 벤아메드 디알로'.split(' ')},
};
function newName(){
  const c=(G&&G.world?G.world.country:SETUP&&SETUP.country)||'';const P=NAME_POOLS[c];
  if(!P)return pick(SURNAMES)+pick(GIVEN);

/* ---------- 계파: 엔진의 두 계열(a·b) 아래에 당 노선에 맞는 계파를 여럿 둔다 ----------
   G.facs[당 id] = [{id,name,wing,mine}], 의원 m.fac = 계파 id(무계파면 null), m.wing = 그 계파의 계열.
   내가 만든 계파(mine)는 내가 수장이다. */
const FAC_POOL={
  reform:['개혁연대','민주광장','청년혁신모임','진보미래포럼','평화와 공존','시민정치연구회','새길포럼'],
  labor:['민생연대','노동정치포럼','농어촌의 힘','공정분배모임','서민경제연구회','풀뿌리연대','일하는 사람들'],
  liberal:['혁신경제포럼','미래성장연구회','자유시장모임','디지털전환포럼','개방과 도전','청년창업연대','열린경제모임'],
  conservative:['국가미래연구회','원조보수','안보우선모임','보수혁신연대','전통과 질서','국민통합포럼','바른정치모임'],
  center:['실용정치모임','중도개혁포럼','통합과 협치','합리주의연구회','민생실용연대','새정치포럼','상식과 균형'],
};
const ideoKey=p=>Object.keys(E.IDEOLOGIES).sort((a,b)=>Math.hypot(E.IDEOLOGIES[a].eco-p.eco,E.IDEOLOGIES[a].soc-p.soc)-Math.hypot(E.IDEOLOGIES[b].eco-p.eco,E.IDEOLOGIES[b].soc-p.soc))[0];
const facsOf=pid=>(G.facs=G.facs||{})[pid]||[];
const facById=id=>{for(const pid in G.facs||{}){const f=G.facs[pid].find(x=>x.id===id);if(f)return f}return null};
function ensureFacs(p){
  G.facs=G.facs||{};if(G.facs[p.id])return G.facs[p.id];
  if(p.fixed)return G.facs[p.id]=[];
  const n=p.seats<8?1:clamp(2+Math.floor(p.seats/45),2,5);
  const names=FAC_POOL[ideoKey(p)].slice().sort(()=>rnd()-.5);
  return G.facs[p.id]=Array.from({length:n},(_,i)=>({id:'f'+(G.fseq=(G.fseq||0)+1),name:names[i%names.length],wing:i%2?'b':'a'}));
}
// 계열에 맞는 계파를 고른다. 그 계열에 계파가 없으면 무계파.
function assignFac(p,m){
  const fs=ensureFacs(p).filter(f=>f.wing===m.wing&&!f.mine);
  if(p.fixed||m.wing===NONE||!fs.length){m.fac=null;m.wing=p.fixed?NONE:m.wing;if(!fs.length)m.wing=NONE;return}
  m.fac=pick(fs).id;
}
const listOf=pid=>pid===G.me.party?G.roster:((G.others||{})[pid]||{list:[]}).list;
const facName=id=>{const f=id&&facById(id);return f?f.name:'무계파'};
// 계파 세력: 소속 의원 영향력의 합(내가 들어 있으면 나도 센다)
function facPower(pid){
  const list=listOf(pid),mine=pid===G.me.party;const tot={};let all=0;
  for(const m of list){all+=m.clout;if(m.fac)tot[m.fac]=(tot[m.fac]||0)+m.clout}
  if(mine&&G.me.fac){const c=cand('me').clout;tot[G.me.fac]=(tot[G.me.fac]||0)+c;all+=c}
  return Object.fromEntries(facsOf(pid).map(f=>[f.id,all?(tot[f.id]||0)/all:0]));
}
function facBoss(pid,fid){
  const f=facById(fid);if(!f)return null;
  if(f.mine&&pid===G.me.party&&G.me.fac===fid)return'me';
  const b=listOf(pid).filter(m=>m.fac===fid).sort((a,b)=>b.clout-a.clout||(a.id<b.id?-1:1))[0];return b?b.id:null;
}
const isBoss=(m,pid)=>!!m.fac&&facBoss(pid||G.me.party,m.fac)===m.id;
// 계파 순위가 높은 수장들(전당대회 후보)
function topBosses(pid,n){
  const pw=facPower(pid);
  return facsOf(pid).slice().sort((a,b)=>pw[b.id]-pw[a.id]).map(f=>facBoss(pid,f.id)).filter(id=>id&&id!=='me').slice(0,n);
}
function relFac(fid,d){for(const m of G.roster)if(m.fac===fid)addRel(m.id,d)}
// 나의 계파 가입·탈퇴·창설. 한 분기에 한 번.
function joinFac(fid){
  const me=G.me;if(G.turn.wingMoved||fid===me.fac)return;
  const old=me.fac&&facById(me.fac);
  if(old){relFac(old.id,-6);if(old.mine)dropMyFac(old)}
  const f=fid&&facById(fid);
  if(f){relFac(f.id,6);me.fac=f.id;me.wing=f.wing;milestone(`${f.name}에 들어갔습니다.`)}
  else{me.fac=null;me.wing=NONE;milestone(`${old?old.name+'를 떠나 ':''}무계파가 됐습니다.`)}
  stat('standing',-1);G.turn.wingMoved=true;
}
// 내가 만든 계파를 떠나면 가장 영향력 큰 회원이 이어받고, 회원이 없으면 없어진다.
function dropMyFac(f){
  const ms=G.roster.filter(m=>m.fac===f.id);
  if(ms.length)f.mine=false;else G.facs[G.me.party]=facsOf(G.me.party).filter(x=>x!==f);
}
function createFac(name,wing){
  const me=G.me;name=String(name||'').replace(/\s+/g,' ').trim().slice(0,12);
  if(!name||G.turn.wingMoved||!canCreateFac())return;
  if(facsOf(me.party).some(f=>f.name===name)){alert('같은 이름의 계파가 이미 있습니다.');return}
  const old=me.fac&&facById(me.fac);if(old){relFac(old.id,-8);if(old.mine)dropMyFac(old)}
  const f={id:'f'+(G.fseq=(G.fseq||0)+1),name,wing,mine:true};ensureFacs(myParty()).push(f);
  me.fac=f.id;me.wing=wing;stat('money',-2);stat('fame',2);G.turn.wingMoved=true;
  milestone(`계파 「${name}」을 만들었습니다.`);
}
const canCreateFac=()=>seated()&&!isIndep()&&(G.me.terms>=2||G.me.stats.standing>=50)&&G.me.stats.money>=2;

/* ---------- 협상: 의원 한 사람과 거래한다 ---------- */
const DEALS={
  ally:{label:'동지 맺기',desc:'어느 당 의원과도 맺습니다. 동지는 당내 선거에서 나를 밀고, 탈당·창당 때 따라옵니다.'},
  recruit:{label:'우리 당으로 영입',desc:'다른 당·무소속 의원을 데려옵니다. 계파 수장이면 계파원 일부가 함께 옵니다.'},
  pact:{label:'계파 지지 거래',desc:'우리 당 계파 수장에게 원내대표 자리를 약속하고 다음 당내 선거에서 그 계파의 표를 받습니다.'},
  join:{label:'내 계파로 영입',desc:'내가 만든 계파에 우리 당 의원을 들입니다.'},
};
function dealKinds(m){
  const mine=!!member(m.id),q=partyOfMember(m.id),out=[];if(!q)return out;
  if(!m.ally)out.push('ally');
  if(!mine&&!isIndep()&&q&&listOf(q.id).length&&(G.others[q.id]||{}).lead!==m.id)out.push('recruit');
  if(mine&&isBoss(m)&&m.fac!==G.me.fac&&!(G.pacts||{})[m.fac])out.push('pact');
  if(mine&&G.me.fac&&(facById(G.me.fac)||{}).mine&&m.fac!==G.me.fac)out.push('join');
  return out;
}
function doDeal(a){
  const m=findMember(a.target);if(!m)return;
  const kind=dealKinds(m).includes(a.kind)?a.kind:dealKinds(m)[0];
  const r=rel(m.id),s=G.me.stats,q=partyOfMember(m.id),P=myParty();
  if(!kind){note(`${m.name} 의원과는 더 맺을 거래가 없습니다.`);return}
  if(kind==='ally'){
    if(rnd()<clamp((r-10)/35+s.standing/300,0,.9)){m.ally=true;addRel(m.id,5);note(`${q.id===P.id?'':q.name+' '}${m.name} 의원과 동지가 됐습니다.`,'good');milestone(`${m.name} 의원과 동지를 맺었습니다.`)}
    else{addRel(m.id,-2);note(`${m.name} 의원이 동지 제안에 선을 그었습니다.`,'bad')}
  }else if(kind==='recruit'){
    const d=Math.hypot(q.eco-P.eco,q.soc-P.soc);
    if(rnd()<clamp((r-20)/40+(1-d)/3+s.fame/300,0,.85)){
      const boss=isBoss(m,q.id)&&r>=35?m.fac:null;
      moveMember(m,q,P);addRel(m.id,5);let n=1;
      if(boss)for(const x of listOf(q.id).filter(x=>x.fac===boss).slice())if(rnd()<.45){moveMember(x,q,P);n++}
      note(`${q.name} ${m.name} 의원${n>1?` 등 ${n}명`:''}이 우리 당으로 옮겨 왔습니다.`,'good');milestone(`${q.name}에서 ${m.name} 의원${n>1?` 등 ${n}명`:''}을 영입했습니다.`);stat('standing',2+n);
    }else{addRel(m.id,-3);note(`${m.name} 의원이 영입 제안을 거절했습니다.`,'bad')}
  }else if(kind==='pact'){
    if(rnd()<clamp(r/40+s.standing/200,0,.85)){(G.pacts=G.pacts||{})[m.fac]=m.id;note(`${facName(m.fac)} 수장 ${m.name} 의원과 거래했습니다. 다음 당내 선거에서 그 계파가 우리를 밀고, 이기면 원내대표 자리를 줍니다.`,'good')}
    else{addRel(m.id,-3);note(`${m.name} 의원이 거래를 거절했습니다.`,'bad')}
  }else if(kind==='join'){
    if(rnd()<clamp((r-5)/35,0,.9)){m.fac=G.me.fac;m.wing=G.me.wing;note(`${m.name} 의원이 「${facName(G.me.fac)}」에 들어왔습니다.`,'good')}
    else{addRel(m.id,-2);note(`${m.name} 의원이 계파 합류를 거절했습니다.`,'bad')}
  }
}

/* ---------- 당적: 탈당·입당·창당·무소속 ---------- */
const isIndep=()=>!!myParty().fixed;
// 무소속 묶음: 나라 모드의 '무소속·기타'를 쓰고, 가상 공화국에는 처음 필요할 때 만든다(선거 판세에는 거의 끼지 않고 의석만 지킨다).
function indepParty(){
  const g=W();let p=g.parties.find(x=>x.fixed);if(p)return p;
  const zero=Object.fromEntries(E.REGIONS.map(r=>[r.id,0]));
  p={id:'pind',no:Math.max(...g.parties.map(x=>x.no))+1,ownerId:null,name:'무소속',leader:'',slogan:'',ideology:'center',colorIdx:7,bot:true,kind:'minor',base:-30,home:null,eco:0,soc:0,
    funds:0,members:1,trust:50,unity:50,talent:0,seats:0,district:0,pr:0,fed:null,allies:[],yields:{},allyLead:null,pmRounds:0,reg:{...zero},delta:null,
    fixed:true,only:[],hold:{...zero},holdPr:0,color:'#7A8580',idea:'무소속',startSeats:0,prw:1,pick:'ind'};
  g.parties.push(p);(G.others=G.others||{})[p.id]={list:[],lead:null,whip:null};G.facs[p.id]=[];
  return p;
}
// 의석 한 개를 옮긴다. 무소속 묶음(hold)은 지역별 보유 의석도 함께 맞춘다.
function moveSeat(from,to,region){
  if(!from||!to||from.seats<=0)return;
  const d=from.district>0;
  if(d){from.district--;to.district++}else{from.pr--;to.pr++}
  from.seats--;to.seats++;
  if(from.hold){if(d){const k=from.hold[region]>0?region:Object.keys(from.hold).find(x=>from.hold[x]>0);if(k)from.hold[k]--}else if(from.holdPr>0)from.holdPr--}
  if(to.hold){if(d)to.hold[region]=(to.hold[region]||0)+1;else to.holdPr=(to.holdPr||0)+1}
}
// 의원 한 사람을 다른 당으로 옮긴다(의석과 명부 함께).
function moveMember(m,from,to){
  const fl=listOf(from.id);const i=fl.indexOf(m);if(i<0)return;fl.splice(i,1);
  moveSeat(from,to,m.region);
  if(G.endorse)delete G.endorse[m.id];
  if(to.fixed){m.fac=null;m.wing=NONE}
  else if(m.fac&&facsOf(to.id).some(f=>f.id===m.fac)){/* 계파째 옮겨 가면 그대로 */}
  else if(to.id===G.me.party&&G.me.fac&&(facById(G.me.fac)||{}).mine&&m.ally){m.fac=G.me.fac;m.wing=G.me.wing}
  else{m.wing=rnd()<.5?'a':'b';assignFac(to,m)}
  listOf(to.id).push(m);
  const o=(G.others||{})[from.id];if(o&&(o.lead===m.id||o.whip===m.id)){if(o.lead===m.id)o.lead=null;if(o.whip===m.id)o.whip=null;pickHeads(from,o)}
  if(from.id===G.me.party){if(G.lead===m.id){G.lead=null}if(G.whipId===m.id)G.whipId=null}
}
// 나를 따라 움직일 의원: 동지, 내가 만든 계파 회원, 아주 가까운 의원
function followers(){
  const fac=G.me.fac&&(facById(G.me.fac)||{}).mine?G.me.fac:null;
  const out=[];
  for(const m of G.roster)if(rnd()<(m.ally?.75:fac&&m.fac===fac?.65:rel(m.id)>=30?.2:0))out.push(m);
  return out;
}
function leaveToIndep(){
  const me=G.me,from=myParty();if(from.fixed)return'';
  const fol=followers().filter(m=>m.ally);
  const to=indepParty();
  for(const m of fol)moveMember(m,from,to);
  switchParty(to.id,'탈당');
  return`${from.name}을 탈당해 무소속이 됐습니다.${fol.length?` 동지 ${fol.length}명이 함께 나왔습니다.`:''}`;
}
const joinChance=t=>{const P=myParty(),d=P.fixed?Math.hypot(t.eco,t.soc)*.5:Math.hypot(t.eco-P.eco,t.soc-P.soc);return clamp(.85-d*.5+G.me.stats.fame/400+(P.fixed?.05:0),.1,.95)};
function applyJoin(pid){
  const t=E.party(W(),pid);if(!t||t.fixed||t.id===G.me.party)return'';
  if(rnd()<joinChance(t)){const from=myParty().name;switchParty(t.id,'입당');return`${from}에서 ${t.name}으로 입당했습니다.`}
  stat('standing',-2);return`${t.name}이 입당을 받아 주지 않았습니다.`;
}
function foundParty(name,ideo){
  const g=W(),me=G.me,from=myParty();
  name=String(name||'').replace(/\s+/g,' ').trim().slice(0,14);
  if(!name||g.parties.some(p=>p.name===name)||!E.IDEOLOGIES[ideo]||me.stats.money<8)return'';
  const I=E.IDEOLOGIES[ideo],live=g.parties.filter(p=>!p.fixed);
  const used=new Set(g.parties.map(p=>p.colorIdx));let ci=0;while(used.has(ci)&&ci<7)ci++;
  const small=live.slice().sort((a,b)=>a.members-b.members)[0];
  const t={id:'pn'+(G.pseq=(G.pseq||0)+1),no:Math.max(...g.parties.map(x=>x.no))+1,ownerId:'me',name,leader:me.name,slogan:'',ideology:ideo,colorIdx:ci,bot:false,kind:'minor',
    base:g.country?Math.min(...live.map(p=>p.base)):0,home:null,eco:I.eco,soc:I.soc,funds:4*E.U,members:g.country?Math.max(.1,small.members*.5):3,
    trust:clamp(35+me.stats.fame*.3,35,70),unity:78,talent:0,seats:0,district:0,pr:0,fed:null,allies:[],yields:{},allyLead:null,pmRounds:0,
    reg:Object.fromEntries(E.REGIONS.map(r=>[r.id,0])),delta:null,fixed:false,idea:I.name,startSeats:0,prw:1,pick:'new'};
  if(g.country){t.m0=t.members;t.income0=(small.income0||4)*.5}
  g.parties.push(t);stat('money',-8);
  // 내 계파는 새 당으로 함께 옮겨 간다.
  const fac=me.fac&&facById(me.fac);
  G.facs[t.id]=fac&&fac.mine?[fac]:[];if(fac&&fac.mine)G.facs[from.id]=facsOf(from.id).filter(x=>x!==fac);
  G.others[t.id]={list:[],lead:null,whip:null};
  const fol=followers();for(const m of fol)moveMember(m,from,t);
  // 다른 당의 동지도 절반쯤 따라온다.
  for(const pid in G.others){if(pid===t.id)continue;const q=E.party(g,pid);for(const m of G.others[pid].list.filter(x=>x.ally).slice())if(rnd()<.5)moveMember(m,q,t)}
  const n=G.others[t.id].list.length;
  switchParty(t.id,'창당');
  setLead('me');
  if(fac&&fac.mine){me.fac=fac.id;me.wing=fac.wing}
  t.startSeats=t.seats;
  return`「${name}」을 창당했습니다. 의원 ${n}명이 함께했습니다.`;
}

function applyFx(fx){
  if(!fx)return'';let out='';
  for(const k in fx){
    if(k==='dirty')G.me.dirty+=fx.dirty;
    else if(k==='risk'){const[pr,bad,txt]=fx.risk;if(rnd()<pr){for(const j in bad)stat(j,bad[j]);out=txt}}
    else stat(k,fx[k]);
  }
  return out;
}
// 당적 옮기기: 의원이면 의석 하나가 따라간다. how: 이동 방식(입당·탈당·창당·영입 등, 경력 문구에 쓴다)
function switchParty(to,how){
  const g=W(),me=G.me,from=myParty(),t=E.party(g,to);
  if(me.seat)moveSeat(from,t,me.region);
  from.ownerId=null;from.bot=true;
  t.ownerId='me';t.bot=true;
  me.party=t.id;me.posts={};me.stats.standing=t.fixed?me.stats.standing:30;stat('local',-6);stat('fame',4);
  // 옛 당 명부는 다른 당 몫으로 넘기고, 새 당 명부를 내 명부로 가져온다. 의원들과의 관계는 그대로 남는다.
  initOthers();
  const oldFac=me.fac&&facById(me.fac);if(oldFac&&oldFac.mine&&how!=='창당')dropMyFac(oldFac);
  const old={list:G.roster||[],lead:G.lead==='me'?null:G.lead,whip:G.whipId==='me'?null:G.whipId};pickHeads(from,old);G.others[from.id]=old;
  const nw=G.others[t.id]||buildOther(t);delete G.others[t.id];
  G.roster=nw.list;G.whipId=nw.whip;G.lead=null;G.conv=null;G.endorse={};G.pacts={};me.fac=null;me.wing=NONE;
  if(!t.fixed&&nw.lead)setLead(nw.lead);
  ensureFacs(t);
  milestone(how==='탈당'?`${from.name}을 탈당해 무소속이 됐습니다.`:how==='창당'?`${from.fixed?'':from.name+'을 떠나 '}「${t.name}」을 창당했습니다.`:`${from.fixed?'무소속에서':from.name+'을 떠나'} ${t.name}${t.fixed?'이 됐습니다':'에 입당했습니다'}.`);
  G.draft=freshDraft();
}
function answer(i,key){
  const e=G.events[i];if(!e||e.done)return;
  const me=G.me;let res='';
  switch(e.type){
    case'info':res=applyFx(e.fx)||'';break;
    case'cutoff':
      if(key==='accept'){me.cutoff=true;stat('standing',8);stat('integrity',2);res='이번 총선에는 나서지 않습니다.'}
      else if(key==='indep'){me.cutoff=false;res=leaveToIndep()+' 무소속으로 출마합니다.';G.turn.moved=true}
      else{
        const g=W(),p=myParty();
        const t=g.parties.filter(o=>!o.fixed&&o.id!==p.id).sort((a,b)=>Math.hypot(a.eco-p.eco,a.soc-p.soc)-Math.hypot(b.eco-p.eco,b.soc-p.soc))[0];
        switchParty(t.id);me.cutoff=false;res=`${t.name} 공천을 받아 출마합니다.`;
      }break;
    case'convAnn':
      if(key==='run'){G.conv.meRun=true;stat('energy',-10);res='출마를 선언했습니다. 표결 전까지 의원들을 만나 표를 모으세요.'}
      else if(key.startsWith('sup:')){G.conv.support=key.slice(4);addRel(G.conv.support,5);res=`${personName(G.conv.support)} 후보 지지를 선언했습니다.`}
      else res=leader()?'불출마를 선언했습니다. 전당대회까지 대표직을 지킵니다.':'중립을 지킵니다.';break;
    case'whip':{const o=runWhip(key);res=o.res;e.html=o.html;break}
    case'offer':if(key==='yes'){me.posts[e.post]=true;milestone(`${POSTS[e.post][0]}을 맡았습니다.`);res=`${POSTS[e.post][0]}을 맡았습니다.`}break;
    case'scandal':
      if(key==='sorry'){stat('fame',-3);stat('standing',-5);stat('local',-4);stat('integrity',5);res='사과로 수습했습니다.'}
      else if(rnd()<.5){stat('fame',2);res='반박이 먹혀 의혹이 잦아들었습니다.'}
      else{
        stat('standing',-12);stat('local',-8);stat('integrity',-5);res='반박이 거짓으로 드러나 역풍을 맞았습니다.';
        if(me.stats.integrity<12&&rnd()<.5){me.over={reason:'jail',text:'검찰 수사 끝에 기소돼 의원직을 잃었습니다.'};res+=' 검찰이 수사에 나섰고 결국 기소됐습니다.'}
      }break;
    case'poach':if(key==='go'){switchParty(e.target);res=`${myParty().name} 소속이 됐습니다.`}else{stat('standing',3);res='당에 남았습니다.'}break;
    case'random':res=applyFx(e.fx&&e.fx[key])||'';break;
    case'resign':
      if(key==='quit'){const t=G.roster.slice().sort((a,b)=>b.clout-a.clout)[0];if(t)setLead(t.id);else me.posts.leader=false;stat('integrity',4);stat('standing',-4);milestone('총선 패배의 책임을 지고 당대표에서 물러났습니다.');G.conv=null;G.next.conv=W().round+2;res=`${t?t.name+' 의원이 권한대행을 맡고, ':''}곧 전당대회가 열립니다.`}
      else{stat('standing',-12);G.conv=null;G.next.conv=W().round+2;res='버티기로 했습니다. 곧 조기 전당대회가 열립니다.'}break;
  }
  e.done=true;e.picked=key;e.result=res;
  save();render();
}

/* ---------- 분기 마치기 ---------- */
function actionAllowed(k){
  const d=ACTS[k],s=G.me.stats;
  if(d.seat&&!seated())return false;
  if(d.energy>0&&s.energy<d.energy)return false;
  if(d.money&&s.money<d.money)return false;
  if(k==='bill'&&(isIndep()||G.draft.acts.some(a=>a.type==='bill')))return false;
  if(k==='endorse'&&isIndep())return false;
  if(ACTS[k].need==='member'&&!(G.roster||[]).length)return false;
  if(k==='deal'&&!(G.roster||[]).length&&!othersList().length)return false;
  return true;
}
function doPersonal(a){
  const s=G.me.stats,d=ACTS[a.type];
  if(d.energy)stat('energy',-d.energy);if(d.money)stat('money',-d.money);
  switch(a.type){
    case'local':stat('local',6*(1-s.local/140));break;
    case'serve':stat('local',3);stat('integrity',2);break;
    case'media':stat('fame',5);if(rnd()<.15){stat('standing',-5);note('방송에서 한 말이 설화로 번졌습니다.','bad')}break;
    case'attack':{stat('fame',G.me.posts.spokes?4:3);stat('standing',2);const t=E.party(W(),a.target);if(t)t.trust-=1;if(rnd()<.2){stat('integrity',-3);note('논평이 지나쳤다는 역풍을 맞았습니다.','bad')}break}
    case'study':stat('expert',5);break;
    case'faction':stat('standing',4);if(G.me.fac){relFac(G.me.fac,4);relWing(G.me.wing,1)}else for(let i=0;i<8&&G.roster.length;i++)addRel(pick(G.roster).id,3);break;
    case'deal':doDeal(a);break;
    case'woo':{const m=findMember(a.target);if(!m)break;const d=12*(1-Math.max(0,rel(m.id))/60);addRel(m.id,d);
      if(member(m.id)){if(isBoss(m))stat('standing',1);note(`${m.name} 의원과 식사했습니다. 관계 ${sign(rel(m.id))}`)}
      else{const q=partyOfMember(m.id);const ally=q&&E.allies(myParty()).includes(q.id);if(!ally)stat('standing',-1);
        note(`${q?q.name+' ':''}${m.name} 의원과 식사했습니다. 관계 ${sign(rel(m.id))}${ally?'':' · 다른 당 의원과 어울린다는 눈총에 입지 −1'}`)}break}
    case'endorse':{const m=member(a.target);if(!m){note('지지 선언은 우리 당 의원에게만 요청할 수 있습니다.','bad');break}
      if(G.endorse[m.id]){note(`${m.name} 의원은 이미 우리를 지지합니다.`);break}
      if(G.conv&&G.conv.cands.includes(m.id)){note(`${m.name} 의원은 전당대회 후보라 다른 사람을 지지하지 않습니다.`,'bad');break}
      const ch=clamp((rel(m.id)-5)/40+G.me.stats.standing/250,0,.9);
      if(rnd()<ch){G.endorse[m.id]=true;addRel(m.id,3);note(`${m.name} 의원(${facName(m.fac)})이 우리를 지지하겠다고 약속했습니다.`,'good')}
      else{addRel(m.id,-3);note(`${m.name} 의원이 지지 요청을 거절했습니다.`,'bad')}break}
    case'donate':myParty().funds+=3*E.U;stat('standing',4);break;
    case'fund':stat('money',3+s.fame/20);stat('integrity',-1);break;
    case'rest':break;
  }
}
function endQuarter(){
  if(G.events.some(e=>!e.done))return;
  const g=W(),me=G.me,p=myParty(),dr=G.draft;
  const prevRound=g.round;
  // 1. 개인 활동
  for(const a of dr.acts)doPersonal(a);
  // 2. 우리 당의 결정: AI 기본안에 내 자리만큼 손을 댄다.
  const base=baseMove();
  // 엔진이 더 붙인 결정(공천 방식·대응 등)은 기본안 그대로 넘긴다.
  const mv={...base,round:g.round,votes:{...base.votes},pm:base.pm,actions:base.actions.map(a=>({...a})),gov:base.gov.map(a=>({...a})),bill:base.bill};
  if(leader()){mv.actions=dr.partyActs.map(a=>({...a}));if(dr.pm)mv.pm=dr.pm}
  if(leader()||whip())Object.assign(mv.votes,dr.partyVotes);
  const slots=govSlots();
  if(slots>0&&fullGov()){mv.gov=dr.gov.slice(0,slots);if(g.pmParty===p.id)mv.bill=dr.govBill}
  else if(me.posts.minister&&slots>0&&dr.minister)mv.gov=[dr.minister,...mv.gov].slice(0,slots);
  // 대표발의: 당의 발의 몫을 내 법안으로 쓴다. 상임위원장이거나 당대표면 반드시, 아니면 입지에 따라 당이 받아 준다.
  const bill=dr.acts.find(a=>a.type==='bill');
  if(bill){
    const ok=leader()||me.posts.chair||rnd()<clamp((me.stats.standing+me.stats.expert)/150+.25,.3,.95);
    if(ok){
      mv.actions=mv.actions.filter(a=>a.type!=='propose');
      const topic=bill.topic||'region',region=bill.region||me.region;
      const act={type:'propose',topic,title:(bill.title||'').trim()||E.TOPICS[topic].title,region};
      if(mv.actions.length>=E.AP)mv.actions.pop();mv.actions.push(act);
      me.pendingBill={title:act.title,round:g.round};me.bills++;
      note(`「${act.title}」을 대표발의했습니다. 다음 분기 본회의에 오를지 지켜봅니다.`);
    }else note('당이 이번 분기 발의 몫을 다른 법안에 줬습니다. 대표발의가 밀렸습니다.','bad');
  }
  // 3. 내 표: 의원만. 당론과 다르면 반란표.
  if(seated()&&!isIndep())for(const it of g.agenda){
    const mine=dr.myVotes[it.id];const line=mv.votes[it.id];
    if(!mine||mine===line||leader()||whip())continue;
    stat('standing',-5);stat('fame',2);me.defy.push(g.round);
    for(const id of[G.lead,G.whipId])if(member(id))addRel(id,-3);
    note(`「${it.title}」에 당론과 다르게 ${mine==='yes'?'찬성':'반대'}했습니다.`,'bad');
  }
  // 계파 요구: 계파가 안건 하나에 표를 요구한다. 따르면 그 계파 의원들과 가까워지고, 거스르면 멀어진다.
  const dem=(g.demands||{})[p.id];
  if(dem&&seated()&&!isIndep()&&g.agenda.some(it=>it.id===dem.item)){
    const v=leader()||whip()?mv.votes[dem.item]:(dr.myVotes[dem.item]||mv.votes[dem.item]);
    relWing(dem.wing,v===dem.want?3:-3);
  }
  // 4. 협상(당대표일 때만)
  p.bot=!leader();p.ownerId='me';
  const talk=leader()?{me:{deals:dr.deals.map(d=>({...d,round:g.round})),replies:dr.replies}}:{};
  // 5. 세계를 한 분기 돌린다.
  const prev={seats:p.seats,pm:g.pmParty,pres:g.presParty,inGov:E.inGov(g,p)};
  G.world=E.resolveRound(g,{me:mv},Date.now(),talk);
  E.useMap(G.world);
  afterQuarter(prevRound,prev);
}
function afterQuarter(round,prev){
  const g=W(),me=G.me,p=myParty(),R=g.report;G.atRound=round;
  // 분기마다 붙는 자리 효과와 회복
  if(me.posts.spokes){stat('fame',2);stat('energy',-4)}
  if(me.posts.chair)stat('expert',1);
  if(me.posts.minister){stat('fame',2);stat('energy',-6)}
  if(whip()){stat('standing',1);stat('fame',1)}
  if(leader()){stat('fame',2);stat('energy',-5)}
  if(headRole()){stat('fame',2);stat('energy',-5)}
  stat('energy',18);
  stat('fame',-(me.stats.fame-35)*.07);
  stat('local',-(me.stats.local-40)*.02);
  // 내가 낸 법안
  if(me.pendingBill&&me.pendingBill.round<round){
    const b=R.bills.find(x=>x.title===me.pendingBill.title&&x.by===p.id);
    if(b){if(b.passed){me.billsPassed++;stat('standing',6);stat('fame',4);note(`대표발의한 「${b.title}」이 가결됐습니다. (찬성 ${b.yes} · 반대 ${b.no})`,'good');milestone(`「${b.title}」 가결.`)}
      else{stat('standing',-1);note(`대표발의한 「${b.title}」이 부결됐습니다.`,'bad')}}
    else note(`「${me.pendingBill.title}」은 의사일정에 오르지 못했습니다.`,'bad');
    me.pendingBill=null;
  }
  // 정부에서 빠지면 장관직도 끝난다.
  if(me.posts.minister&&!E.inGov(g,p)){me.posts.minister=false;note('정권이 바뀌어 장관에서 물러났습니다.');milestone('장관에서 물러났습니다.')}
  // 대통령 선거
  if(R.pres){
    const w=R.pres.winner;
    if(w===p.id&&leader()&&!me.posts.president){me.posts.president=true;milestone(`대통령에 당선됐습니다.`);note('대통령 선거에서 당선됐습니다!','good');stat('fame',15)}
    else if(me.posts.president&&w!==p.id){me.posts.president=false;milestone('대통령 임기를 마쳤습니다.');note('대통령 임기를 마쳤습니다.')}
    else if(me.posts.president)note('대통령 선거에서 우리 당이 정권을 지켰습니다. 대통령 임기를 이어 갑니다.','good');
  }
  // 총리 지명
  if(!isPresSys()&&R.pm&&R.pm.winner===p.id&&leader()&&!seated())note(`우리 당이 총리를 냈지만 당대표가 원외라 ${newName()} 의원이 총리를 맡습니다.`);
  if(!isPresSys()&&R.pm&&R.pm.winner===p.id&&leader()&&seated()){milestone('총리로 지명됐습니다.');note('총리로 지명됐습니다!','good');stat('fame',10)}
  if(!isPresSys()&&prev.pm===p.id&&g.pmParty!==p.id&&leader()&&seated())note('총리 자리를 잃었습니다.','bad');
  // 총선·해산: 내 지역구
  const el=R.election;
  if(el&&el.kind!=='mid'){
    const regRes=el.regions.find(x=>x.id===me.region);
    if(me.cutoff){me.seat=false;me.cutoff=false;for(const k of['whip','chair','minister'])me.posts[k]=false;note('이번 총선에 나서지 않아 원외 인사가 됐습니다.');milestone('총선에 불출마해 원외로 물러났습니다.')}
    else{
      const ind=isIndep(),regSeats=E.REG[me.region].seats,frac=ind?0:(regRes.seats[p.id]||0)/regSeats;
      const camp=Math.min(me.stats.money,6);me.stats.money-=camp;
      const chance=clamp(frac*.85+(me.stats.local-50)/120+(me.stats.fame-50)/400+(me.stats.integrity-50)/600+camp*.012+(ind?.12:0),.03,.97);
      const won=rnd()<chance;
      if(won){
        // 당이 그 권역에서 한 석도 못 얻었는데 내가 이겼다면, 그 권역 1위 당에서 한 석을 옮겨 맞춘다.
        if(!ind&&!(regRes.seats[p.id]>0)){const w=E.party(g,regRes.winner);if(w&&w.district>0&&w.id!==p.id)moveSeat(w,p,me.region)}
        // 무소속으로 원외였다가 당선되면 무소속 묶음에 의석을 하나 더한다.
        if(ind&&!me.seat){const w=E.party(g,regRes.winner);if(w&&w.id!==p.id&&w.district>0)moveSeat(w,p,me.region)}
        me.terms++;me.seat=true;
        note(`${E.REG[me.region].name}에서 당선됐습니다! (당선 가능성 ${Math.round(chance*100)}%)`,'good');milestone(`${me.terms}선 고지에 올랐습니다.`);stat('fame',3);
        if(ind)note('무소속으로 살아남았습니다.','good');
      }else{
        // 무소속이 지면 지키던 의석을 그 지역 1위 당이 가져간다.
        if(ind&&me.seat){const w=E.party(g,regRes.winner);if(w&&w.id!==p.id)moveSeat(p,w,me.region)}
        me.seat=false;for(const k of['whip','chair','minister'])me.posts[k]=false;
        note(`${E.REG[me.region].name}에서 낙선했습니다. (당선 가능성 ${Math.round(chance*100)}%)`,'bad');milestone('총선에서 낙선했습니다.');stat('standing',-6);
      }
    }
    // 크게 지면 당대표 책임론
    if(leader()&&!me.posts.president&&p.seats<prev.seats*.85){addEventLater({type:'resign',title:'총선 패배 책임론',text:`우리 당이 ${prev.seats}석에서 ${p.seats}석으로 줄었습니다. 당 안에서 사퇴하라는 목소리가 높습니다.`,
      opts:[['quit','책임지고 사퇴한다','청렴 +4, 입지 −4. 당대표에서 물러납니다.'],['stay','버틴다','입지 −12. 다음 분기 조기 전당대회가 열립니다.']]})}
  }
  syncRoster(!!(el&&el.kind!=='mid'));
  otherConventions(round);
  // 체력이 바닥이면 쓰러진다.
  if(me.stats.energy<=0){note('과로로 쓰러져 한동안 일정을 줄였습니다. 지역 기반 −3','bad');stat('local',-3);me.stats.energy=20}
  me.peak=Math.max(me.peak,postScore());
  G.lastReport={round,notes:G.turn.notes,others:G.turn.world||[],d:G.turn.d,events:G.events.filter(e=>e.done).map(e=>({title:e.title,picked:e.opts?((e.opts.find(o=>o[0]===e.picked)||[])[1]):null,result:e.result})),world:R,partyId:p.id};
  G.atRound=null;G.events=G.later||[];G.later=[];
  if(g.status==='over'||me.over){G.over=true}
  else{newTurn();prepareQuarter()}
  save();render();showReport();
}
function addEventLater(e){(G.later=G.later||[]).push(e)}

function renderPlay(){

  const g=W(),me=G.me,mineP=myParty();

  const own=vid===mineP.id,p=E.party(g,vid),o=own?{list:G.roster,lead:G.lead,whip:G.whipId}:G.others[vid];
  const list0=o.list,ws=p.fixed?[]:wingsOf(p);
  const flt=G.ui&&G.ui.flt||'all',more=G.ui&&G.ui.more;

  const avg=w=>{const ms=list0.filter(m=>m.wing===w);return ms.length?Math.round(ms.reduce((n,m)=>n+rel(m.id),0)/ms.length):0};

  if(!G||!G.world||a==='resume'||a==='discard'||a==='start'){
    switch(a){
      case'bg':SETUP.bg=v;break;
      case'country':SETUP.country=v;SETUP.party=null;refreshSetupWorld();break;
      case'party':SETUP.party=v;SETUP.region=bestRegion(SETUP.world,v);SETUP.wing='n';break;
      case'swing':SETUP.wing=v;break;
      case'region':SETUP.region=v;break;
      case'start':SETUP.name=$('#s-name').value;startGame();return;
      case'resume':G=load();E.useMap(G.world);G.turn=G.turn||{d:{},notes:[]};if(!G.roster){G.rel=G.rel||{};initCaucus();G.next.conv=Math.max(G.next.conv,G.world.round+1)}if(!G.others)initOthers();migrateFacs();save();render();return;
      case'discard':try{localStorage.removeItem(SAVE_KEY)}catch(e){}break;
    }
    if(!G||!G.world)renderSetup();return;
  }
  const dr=G.draft;
  switch(a){
    case'close':$('#modal').hidden=true;render();break;
    case'answer':answer(+b.dataset.i,v);break;
    case'add':{const x={type:v};if(v==='attack')x.target=W().parties.filter(o=>o.id!==G.me.party&&!o.fixed).sort((p,q)=>q.seats-p.seats)[0].id;
      // 기본 대상: 경쟁 후보는 빼고, 아직 우리를 지지하지 않은 의원 가운데 영향력과 관계가 큰 사람
      if(v==='deal'){const m=b.dataset.m?findMember(b.dataset.m):G.roster.slice().sort((p,q)=>rel(q.id)-rel(p.id))[0]||othersList()[0];x.target=m.id;x.kind=b.dataset.k||dealKinds(m)[0]||''}
      if(ACTS[v].need==='member'){const rivals=[...(G.conv?G.conv.cands:[]),...(G.whipCands||[])];
        const pool=G.roster.filter(m=>!rivals.includes(m.id)&&!(v==='endorse'&&G.endorse[m.id]));
        const t=b.dataset.m?member(b.dataset.m):(pool.length?pool:G.roster).slice().sort((p,q)=>q.clout+(v==='endorse'?rel(q.id):0)-p.clout-(v==='endorse'?rel(p.id):0))[0];x.target=t.id}
      if(v==='bill'){x.topic=Object.keys(E.TOPICS).sort((p,q)=>E.billAlign(E.TOPICS[q],myParty())-E.billAlign(E.TOPICS[p],myParty()))[0];x.region=G.me.region}
      dr.acts.push(x);save();render();break}
    case'rm':dr.acts.splice(+v,1);save();render();break;
    case'jfac':joinFac(v==='none'?null:v);save();render();break;
    case'cfac':createFac((G.ui||{}).fname,v);save();render();break;
    case'leave':if(confirm('탈당하면 입지를 잃고 맡은 자리를 내려놓습니다. 탈당할까요?')){const r=leaveToIndep();G.turn.moved=true;if(r)note(r);save();render()}break;
    case'joinp':{const t=E.party(W(),(G.ui||{}).join)||W().parties.filter(p=>!p.fixed&&p.id!==G.me.party).sort((a,b)=>b.seats-a.seats)[0];if(t&&confirm(`${t.name}에 입당을 신청할까요?`)){const r=applyJoin(t.id);G.turn.moved=true;note(r);alert(r);save();render()}break}
    case'found':{const ui=G.ui||{};const nm=String(ui.pname||'').trim();if(!nm){alert('새 당 이름을 적어 주세요.');break}
      if(W().parties.some(p=>p.name===nm)){alert('같은 이름의 정당이 이미 있습니다.');break}
      if(confirm(`「${nm}」을 창당할까요? 정치자금 8이 듭니다.`)){const r=foundParty(nm,ui.pideo||ideoKey(myParty().fixed?{eco:0,soc:0}:myParty()));G.turn.moved=true;if(r){note(r);alert(r)}save();render()}break}
    case'flt':G.ui={...(G.ui||{}),flt:v,more:false};render();break;
    case'vparty':G.ui={...(G.ui||{}),party:v,flt:'all',more:false};render();break;
    case'more':G.ui={...(G.ui||{}),more:!(G.ui&&G.ui.more)};render();break;
    case'vote':dr.myVotes[b.dataset.id]=v;save();render();break;
    case'pvote':dr.partyVotes[b.dataset.id]=v;save();render();break;
    case'padd':dr.partyActs.push({type:'policy',level:2});save();render();break;
    case'prm':dr.partyActs.splice(+v,1);save();render();break;
    case'reply':dr.replies[b.dataset.k]=v;save();render();break;
    case'end':endQuarter();break;
    case'retire':if(confirm('정계를 떠나면 여기서 경력이 끝납니다. 은퇴할까요?')){G.me.over={reason:'retire',text:'스스로 정계를 떠났습니다.'};G.over=true;save();render()}break;
    case'new':try{localStorage.removeItem(SAVE_KEY)}catch(e){}G=null;SETUP=null;render();break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='s-rounds'){SETUP.rounds=+t.value;refreshSetupWorld();renderSetup();return}
  if(!G||!G.world)return;
  const dr=G.draft,i=+t.dataset.i;
  if(t.dataset.ui&&t.tagName==='SELECT'){G.ui={...(G.ui||{}),[t.dataset.ui]:t.value};render()}
  else if(t.dataset.act){dr.acts[i][t.dataset.act]=t.value;if(t.dataset.act==='topic'){dr.acts[i].title='';render()}
    if(t.dataset.act==='target'&&dr.acts[i].type==='deal'){const m=findMember(t.value);dr.acts[i].kind=m?dealKinds(m)[0]||'':''}if(t.dataset.act==='target'||t.dataset.act==='kind')render()}
  else if(t.dataset.pact){const a=dr.partyActs[i];const k=t.dataset.pact;
    if(k==='type'){const d=E.ACTIONS[t.value];dr.partyActs[i]={type:t.value,level:2};const n=dr.partyActs[i];
      if(d.need.includes('region'))n.region=G.me.region;if(d.need.includes('target'))n.target=W().parties.filter(o=>o.id!==G.me.party).sort((x,y)=>y.seats-x.seats)[0].id;
      if(d.need.includes('topic'))n.topic=Object.keys(E.TOPICS).sort((x,y)=>E.billAlign(E.TOPICS[y],myParty())-E.billAlign(E.TOPICS[x],myParty()))[0]}
    else a[k]=k==='level'?+t.value:t.value;render()}
  else if(t.dataset.gov){const k=t.dataset.gov;const list=fullGov()?dr.gov:null;
    if(k==='type'){const d=t.value?E.GOV[t.value]:null;const n=d?{type:t.value}:null;
      if(n&&d.need.includes('region'))n.region=G.me.region;if(n&&d.need.includes('target'))n.target=W().parties.filter(o=>o.id!==G.me.party).sort((x,y)=>y.seats-x.seats)[0].id;
      if(list){if(n)list[i]=n;else list.splice(i,1)}else dr.minister=n}
    else{const a=list?list[i]:dr.minister;if(a)a[k]=t.value}render()}
  else if(t.dataset.govbill)dr.govBill=+t.value;
  else if(t.dataset.pm)dr.pm=t.value;
  else if(t.dataset.deal){const k=t.dataset.deal;if(k==='to'){dr.deals=t.value?[{id:'d'+W().round,to:t.value,pm:null,topic:null,yieldReg:null,yieldBy:null,endorse:null}]:[]}else if(dr.deals[0])dr.deals[0][k]=t.value||null;render()}
  save();
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='s-name'&&SETUP)SETUP.name=t.value;
  if(G&&G.draft&&t.dataset.act==='title'){G.draft.acts[+t.dataset.i].title=t.value;save()}
  if(G&&t.dataset.ui&&t.tagName==='INPUT')G.ui={...(G.ui||{}),[t.dataset.ui]:t.value};
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').hidden){$('#modal').hidden=true;render()}});
render();
</script>
</body>
</html>
