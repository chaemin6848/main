<style>
/* Layout: one column — title + language switch, then one card per game with both save meters */
.hub{display:grid;gap:28px;padding-top:12px}
.hub .top{align-items:flex-start}
.hub .site-home{margin-bottom:-18px;justify-self:start}
.hub h1{font-size:1.7rem}
.lead{margin:6px 0 0;color:var(--muted);font-size:.9rem;max-width:46ch}
.games{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.game{display:grid;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none;
  border-left:6px solid var(--v0);transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--fg);border-left-color:var(--v0);transform:translateY(-1px)}
.game:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.gtitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.gtitle h2{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.gtitle h2 b{font-weight:400;color:var(--v0)} .gtitle h2 i{font-style:normal;color:var(--v1)}
.gtitle span{font-size:.8rem;color:var(--muted)}
.game p{margin:0;font-size:.85rem;color:var(--muted)}
.game .meters{margin-top:0}
.go{font-size:.85rem;font-weight:600}
.go span{display:inline-block;transition:transform .15s}
.game:hover .go span{transform:translateX(3px)}
.steps{font-size:.85rem;color:var(--muted);margin:8px 0 0;padding-left:1.2em}
.steps li{margin:4px 0}
@media (prefers-reduced-motion:reduce){.game,.go span{transition:none}}
</style>
</head>

<div class="wrap hub">
  <a class="home site-home" href="/" data-i="site"></a>
  <div class="top">
    <div>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <div class="topr">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button type="button" data-l="ko" lang="ko">한국어</button>
        <button type="button" data-l="ja" lang="ja">日本語</button>
        <button type="button" data-l="en" lang="en">English</button>
      </div>
      <div class="acct" id="acct"><button type="button" class="acct-btn"></button></div>
    </div>
  </div>

  <ul class="games">

    <li><a class="game" href="rs/" data-game="rs"></a></li>

  </ul>

    <ul class="steps" id="how"></ul>
  </section>
