  trade:(pl,give)=>`In-game trade at ${pl} (give ${give})`,
  sep:" · ",
  recvT:O=>`Get from your ${O} save`,recvN:O=>`Already registered in ${O}. Trade it over and back to register it in both.`,
  recvTE:"Registers on receipt (already trade-evolved)",recvReg:"Registered in the other save",
  tradeT:"Trade evolutions",tradeN:"Send the previous stage to the other save and trade it back to evolve.",
  tradeHow:(f,inT,O)=>`Trade ${f}${inT?"":` (in ${O})`}`,
  evoT:"Evolve",evoN:"You already have the previous stage. Just level it or use a stone.",
  evoHow:(f,m,inT,O)=>`${f} → ${m}${inT?"":` · get ${f} from ${O}`}`,
  exclT:O=>`Catch in ${O} and trade over`,exclN:T=>`Version exclusives that don't appear in the wild in ${T}.`,
  catchT:"Catch",
  choiceT:"Choices (pick one)",choiceN:"You only get one starter, one fossil and one Dojo fighter per save. Pick the other one in the other save. The third starter line needs a new save or a friend.",
  preT:"Start from earlier stages",preN:"Neither save has the previous stage yet. Work through them in this order.",
  preHow:(f,m,b,bl)=>`${f} ${m} · start: ${b}, ${bl}`,
  intro:(T,n)=>`${n} Pokémon left in ${T}, grouped by what you can do now. Tap FR or LG to mark it in that save.`,
  count:n=>`${n}`,
  done:T=>`${T} Kanto Dex complete: all 150! Mew is event-only, so it isn't counted.`
 }
};

const P={};
D.forEach(r=>P[r[0]]={no:r[0],ko:r[1],ja:r[2],en:r[3],from:r[4]||0,evo:r[5]||0,loc:r[6]||[],ver:r[7]||"",ch:r[8]||""});
D.forEach(r=>{const p=P[r[0]];if(!p.ver&&p.from&&P[p.from].ver)p.ver=P[p.from].ver});

/* ===== 저장 ===== */
const KEY="frlg-dex-helper-v1", CKEY="frlg-cookie-consent", CNAME="frlg_dex";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function getCookie(n){const m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
function setCookie(n,v,days){const sec=location.protocol==="https:"?"; Secure":"";document.cookie=`${n}=${encodeURIComponent(v)}; Max-Age=${days*86400}; Path=/; SameSite=Lax${sec}`}
const delCookie=n=>{document.cookie=`${n}=; Max-Age=0; Path=/; SameSite=Lax`};
const LANGS=["ko","ja","en"];
function detectLang(){const l=(navigator.language||"").toLowerCase();return l.startsWith("ko")?"ko":l.startsWith("ja")?"ja":"en"}
let consent=lsGet(CKEY)||(getCookie(CKEY)==="yes"?"yes":null);
const fresh=()=>({fr:{},lg:{},save:"fr",tab:"plan",f:"all",lang:detectLang()});
let S=null;
try{S=JSON.parse(lsGet(KEY)||"null")}catch(e){}
// 쿠키 형식: FR<hex>.LG<hex>|세이브|탭|필터|언어
function fromCookie(){
  const c=getCookie(CNAME);if(!c)return null;
  const [code,sv,tab,f,lang]=c.split("|");const m=code&&code.match(/^FR([0-9a-f]+)\.LG([0-9a-f]+)$/i);
  if(!m)return null;
  try{return{fr:dec(m[1]),lg:dec(m[2]),save:sv==="lg"?"lg":"fr",tab:tab==="dex"?"dex":"plan",f:["all","need","F","L","T"].includes(f)?f:"all",lang:LANGS.includes(lang)?lang:detectLang()}}catch(e){return null}
}
if(!S||!S.fr){S=(consent==="yes"&&fromCookie())||fresh()}
if(!LANGS.includes(S.lang))S.lang=detectLang();
delete S.hideSup;
const save=()=>{
  lsSet(KEY,JSON.stringify(S));
  if(consent==="yes")setCookie(CNAME,[encode(),S.save,S.tab,S.f,S.lang].join("|"),365);
};
const has=(v,n)=>!!S[v][n];
const other=v=>v==="fr"?"lg":"fr";

/* ===== 표시 도우미 ===== */
const L=()=>T[S.lang];
const li=()=>LI[S.lang];
const nm=n=>P[n][S.lang];
const secLang=()=>S.lang==="ja"?"en":"ja";
const VN=v=>L()[v==="fr"?"FR":"LG"];
const pad=n=>String(n).padStart(3,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const evoTxt=e=>typeof e==="number"?L().lv(e):EVO[e][li()];
function locTxt(p){
  const out=[];let nums=[];
  const flush=()=>{if(nums.length){out.push(L().route(nums));nums=[]}};
  p.loc.forEach(t=>{
    if(typeof t==="number"){nums.push(t);return}
    flush();
    if(t.startsWith("T:")){
      const [,pl,give]=t.split(":");
      const place=/^\d+$/.test(pl)?L().route([+pl]):PLACE[pl][li()];
      const gv=give.split("/").map(g=>{const m=g.match(/^(\d+)([FL]?)$/);return nm(+m[1])+(m[2]?` (${m[2]==="F"?"FR":"LG"})`:"")}).join(" / ");
      out.push(L().trade(place,gv));return;
    }
    if(t==="etc"||t==="x2"){const last=out.pop()||"";out.push(last+(S.lang==="en"?" ":S.lang==="ja"?"":" ")+PLACE[t][li()]);return}
    out.push(PLACE[t][li()]);
  });
  flush();
  return out.join(L().sep);
}
function tagHtml(p){
  let t="";
  if(p.ver)t+=`<span class="tag ${p.ver}">${L()[p.ver==="F"?"tagF":"tagL"]}</span>`;
  if(p.evo==="trade")t+=`<span class="tag T">${L().tagT}</span>`;
  return t;
}
function pills(n){
  return `<span class="pills"><button type="button" class="pill fr${has("fr",n)?" on":""}" data-v="fr" data-n="${n}" aria-pressed="${has("fr",n)}" aria-label="${L().pillFR}">FR</button><button type="button" class="pill lg${has("lg",n)?" on":""}" data-v="lg" data-n="${n}" aria-pressed="${has("lg",n)}" aria-label="${L().pillLG}">LG</button></span>`;
}
function row(p,how){
  const sl=secLang();
  return `<li><span class="no">${pad(p.no)}</span><span class="nm"><span class="pn">${esc(p[S.lang])}</span><span class="sn" lang="${sl}">${esc(p[sl])}</span>${tagHtml(p)}<span class="how">${esc(how)}</span></span>${pills(p.no)}</li>`;
}
function baseOf(p){while(p.from)p=P[p.from];return p}

/* ===== 할 일 ===== */
function plan(){
  const t=L(),Tv=S.save,O=other(Tv),tv=Tv==="fr"?"F":"L",ON=VN(O),TN=VN(Tv);
  const G=[
    {k:"recv",t:t.recvT(ON),n:t.recvN(ON),d:[]},
    {k:"trade",t:t.tradeT,n:t.tradeN,d:[]},
    {k:"evo",t:t.evoT,n:t.evoN,d:[]},
    {k:"excl",t:t.exclT(ON),n:t.exclN(TN),d:[]},
    {k:"catch",t:t.catchT,n:"",d:[]},
    {k:"choice",t:t.choiceT,n:t.choiceN,d:[]},
    {k:"pre",t:t.preT,n:t.preN,d:[]}
  ];
  const g=k=>G.find(x=>x.k===k).d;
  for(let n=1;n<=150;n++){
    if(has(Tv,n))continue;
    const p=P[n];
    if(has(O,n)){g("recv").push([p,p.evo==="trade"?t.recvTE:(p.from?t.recvReg:locTxt(p))]);continue}
    if(p.from){
      const f=P[p.from],inT=has(Tv,f.no),inO=has(O,f.no);
      if(p.evo==="trade"&&(inT||inO)){g("trade").push([p,t.tradeHow(nm(f.no),inT,ON)]);continue}
      if(inT||inO){g("evo").push([p,t.evoHow(nm(f.no),evoTxt(p.evo),inT,ON)]);continue}
      const b=baseOf(p);
      g("pre").push([p,t.preHow(nm(f.no),evoTxt(p.evo),nm(b.no),locTxt(b))]);continue;
    }
    if(p.ch){g("choice").push([p,locTxt(p)]);continue}
    if(p.ver&&p.ver!==tv){g("excl").push([p,`${ON}: ${locTxt(p)}`]);continue}
    g("catch").push([p,locTxt(p)]);
  }
  const total=G.reduce((a,x)=>a+x.d.length,0);
  const el=document.getElementById("plan");
  if(!total){el.innerHTML=`<div class="empty">${t.done(TN)}</div>`;return}
  el.innerHTML=`<p class="note" style="margin-top:16px">${t.intro(TN,total)}</p>`+
    G.filter(x=>x.d.length).map(x=>`<section><div class="gh"><h2>${x.t}</h2><span class="gc">${t.count(x.d.length)}</span></div>${x.n?`<p class="note">${x.n}</p>`:""}<ul>${x.d.map(([p,h])=>row(p,h)).join("")}</ul></section>`).join("");
}

/* ===== 전체 도감 ===== */
function dex(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const f=S.f,Tv=S.save;
  const list=D.map(r=>P[r[0]]).filter(p=>{
    if(f==="need"&&(has(Tv,p.no)||p.no===151))return false;
    if((f==="F"||f==="L")&&p.ver!==f)return false;
    if(f==="T"&&p.evo!=="trade")return false;
    if(q&&!(String(p.no).includes(q)||pad(p.no).includes(q)||p.ko.includes(q)||p.ja.includes(q)||p.en.toLowerCase().includes(q)))return false;
    return true;
  });
  const ul=document.getElementById("dexList");
  if(!list.length){ul.innerHTML=`<li style="display:block;color:var(--muted)">${L().noMatch}</li>`;return}
  ul.innerHTML=list.map(p=>{
    let how=p.from?`${nm(p.from)} → ${evoTxt(p.evo)}`:locTxt(p);
    if(p.ver&&!p.from)how=`${VN(p.ver==="F"?"fr":"lg")}: ${locTxt(p)}`;
    return row(p,how);
  }).join("");
}

/* ===== 공통 렌더 ===== */
function applyLang(){
  const t=L();
  document.documentElement.lang=S.lang;
  document.title=t.title;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i];if(typeof v==="string")el.textContent=v});
  document.getElementById("q").placeholder=t.q;
  document.getElementById("saveSeg").setAttribute("aria-label",t.saveLbl);
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
  document.getElementById("privLink").href="privacy.html#"+S.lang;
  document.getElementById("ckMore").href="privacy.html#"+S.lang;
  whereText();
  const links=DONATE.filter(d=>d.url&&(!d.only||d.only===S.lang));
  document.getElementById("support").hidden=!links.length||supHidden;
  document.getElementById("supShow").hidden=!links.length;
  document.getElementById("supX").setAttribute("aria-label",t.supHide);document.getElementById("supX").title=t.supHide;
  document.getElementById("supBtns").innerHTML=links.map(d=>`<a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label)}</a>`).join("");
  if(!armed)rb.textContent=t.reset;
}
function meters(){
  ["fr","lg"].forEach(v=>{
    let c=0;for(let n=1;n<=150;n++)if(has(v,n))c++;
    const id=v==="fr"?"Fr":"Lg";
    document.getElementById("m"+id).textContent=`${c} / 150`;
    document.getElementById("b"+id).style.width=(c/150*100)+"%";
  });
  document.getElementById("code").value=encode();
}
function render(){
  meters();
  document.querySelectorAll("#saveSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.save));
  document.getElementById("tabPlan").setAttribute("aria-selected",S.tab==="plan");
  document.getElementById("tabDex").setAttribute("aria-selected",S.tab==="dex");
  document.getElementById("plan").hidden=S.tab!=="plan";
  document.getElementById("dex").hidden=S.tab!=="dex";
  document.querySelectorAll("#filt .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===S.f));
  if(S.tab==="plan")plan();else dex();
}

/* ===== 백업 코드: 세이브별 151비트를 16진수로 ===== */
function enc(v){let s="";for(let i=0;i<152;i+=4){let x=0;for(let j=0;j<4;j++){const n=i+j+1;if(n<=151&&has(v,n))x|=1<<j}s+=x.toString(16)}return s}
function dec(h){const o={};for(let i=0;i<h.length;i++){const x=parseInt(h[i],16);if(isNaN(x))throw 0;for(let j=0;j<4;j++){const n=i*4+j+1;if(n<=151&&(x>>j&1))o[n]=1}}return o}
function encode(){return `FR${enc("fr")}.LG${enc("lg")}`}
function msg(k){const m=document.getElementById("msg");m.textContent=L()[k];clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",3000)}

/* ===== 쿠키 동의 ===== */
const banner=document.getElementById("cookie");
function showBanner(){banner.hidden=false;document.body.classList.add("has-banner")}
function hideBanner(){banner.hidden=true;document.body.classList.remove("has-banner")}
function whereText(){document.getElementById("where").textContent=consent==="yes"?L().where1:L().where0}
function setConsent(v){
  consent=v;lsSet(CKEY,v);
  if(v==="yes"){setCookie(CKEY,"yes",365);save()}else{delCookie(CNAME);delCookie(CKEY)}
  hideBanner();whereText();
}

/* ===== 이벤트 ===== */
const rb=document.getElementById("reset");let armed=false;
let supHidden=false; // 닫아도 새로 들어오면 다시 보여요
document.addEventListener("click",e=>{
  const pl=e.target.closest(".pill");
  if(pl){const v=pl.dataset.v,n=pl.dataset.n;if(S[v][n])delete S[v][n];else S[v][n]=1;save();render();return}
  const lb=e.target.closest("#langSeg button");if(lb){S.lang=lb.dataset.l;save();applyLang();render();return}
  const sb=e.target.closest("#saveSeg button");if(sb){S.save=sb.dataset.v;save();render();return}
  if(e.target.id==="tabPlan"){S.tab="plan";save();render();return}
  if(e.target.id==="tabDex"){S.tab="dex";save();render();return}
  const ch=e.target.closest("#filt .chip");if(ch){S.f=ch.dataset.f;save();render();return}
});
document.getElementById("q").addEventListener("input",dex);
document.getElementById("copy").addEventListener("click",()=>{
  const t=document.getElementById("code");
  navigator.clipboard.writeText(t.value).then(()=>msg("mCopied")).catch(()=>{t.select();msg("mSelected")});
});
document.getElementById("load").addEventListener("click",()=>{
  const m=document.getElementById("code").value.trim().match(/^FR([0-9a-f]+)\.LG([0-9a-f]+)$/i);
  if(!m){msg("mBad");return}
  try{S.fr=dec(m[1]);S.lg=dec(m[2]);save();render();msg("mLoaded")}catch(e){msg("mFail")}
});
rb.addEventListener("click",()=>{
  if(!armed){armed=true;rb.classList.add("arm");rb.textContent=L().resetArm;setTimeout(()=>{armed=false;rb.classList.remove("arm");rb.textContent=L().reset},3000);return}
  S.fr={};S.lg={};save();render();armed=false;rb.classList.remove("arm");rb.textContent=L().reset;msg("mReset");
});
document.getElementById("ckYes").addEventListener("click",()=>{setConsent("yes");msg("mCkOn")});
document.getElementById("ckNo").addEventListener("click",()=>{setConsent("no");msg("mCkOff")});
document.getElementById("cookieSet").addEventListener("click",showBanner);
document.getElementById("supX").addEventListener("click",()=>{supHidden=true;applyLang();msg("mSupHid")});
document.getElementById("supShow").addEventListener("click",()=>{supHidden=false;applyLang();window.scrollTo({top:0,behavior:"smooth"})});

applyLang();
if(!consent)showBanner();
render();
</script>
</body>
</html>
