<style>
/* 레이아웃과 색은 일유알리미와 같다: 머리말 + 패널 묶음, 게임 화면만 세 단으로 넓힌다. */
:root{
  --bg:#f6f7f9; --card:#ffffff; --mine:#eef3ff; --ink:#1b2230; --ink2:#5d6676; --line:#dde1e8;
  --accent:#1f4fa8; --on-accent:#ffffff; --stamp:#b42318; --warn:#9a5b00; --shade:rgba(15,20,30,.45);
  --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --card:#181d26; --mine:#1b2438; --ink:#e6e9ef; --ink2:#9aa3b2; --line:#2b3240;
  --accent:#8fb2ff; --on-accent:#181d26; --stamp:#ff8a7e; --warn:#f0b85a; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --card:#181d26; --mine:#1b2438; --ink:#e6e9ef; --ink2:#9aa3b2; --line:#2b3240;
  --accent:#8fb2ff; --on-accent:#181d26; --stamp:#ff8a7e; --warn:#f0b85a; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font-size:1rem;letter-spacing:.04em;color:var(--accent);font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)}.small{font-size:13px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:8px;padding:8px 16px;font-weight:600}
.ndc-home{display:flex;align-items:center;gap:6px;align-self:flex-start;width:max-content;text-decoration:none;font-size:12px;letter-spacing:.06em;padding:4px 0;font-family:var(--sans);color:var(--ink2);margin-bottom:14px}.ndc-home:hover{color:var(--accent)}.ndc-home:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:4px}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px;min-width:0}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:22px;align-items:center;padding-block:4px 18px}
.mark{font-size:1.55rem;font-weight:700}
.stamp{display:inline-block;width:1em;height:1em;font-size:24px;line-height:0;color:var(--stamp);transform:rotate(-9deg);flex:none}
.lede{color:var(--ink2);max-width:70ch;margin-top:6px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.rooms{display:grid;gap:6px}
.room{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%;text-align:left}
.room:hover{border-color:var(--accent)}
.code{font:500 1rem/1.2 var(--mono);letter-spacing:.08em}
.join{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.notice{background:var(--mine);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink2)}
details>summary{cursor:pointer;font-weight:700}
.rules{display:grid;gap:8px;margin-top:10px;font-size:14px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px}

/* 투표용지 줄 */
.ballot{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.b-row{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:stretch;border-top:1px solid var(--line)}
.b-row:first-child{border-top:0}
.b-no{display:grid;place-items:center;font:500 1rem/1 var(--mono);color:#fff;background:var(--c)}
.b-name{padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.b-name strong{font-weight:700;display:block}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.ideos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.ideo{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;text-align:left;display:grid;gap:2px}
.ideo[aria-pressed="true"]{border-color:var(--accent);background:var(--mine)}
.ideo:disabled{opacity:.55;cursor:not-allowed}
.ideo b{font-size:14px}.ideo span{font-size:12px;color:var(--ink2)}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lobby-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}

/* 게임 화면 */
.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-bottom:12px}
.topbar .logo{font-size:1.25rem;font-weight:700}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.78rem;white-space:nowrap}
.pill.hot{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.mybar{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(70px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.mybar>div{background:var(--card);padding:8px 12px;min-width:0}
.mybar .k{font-size:.75rem;color:var(--ink2);display:block}
.mybar .v{font:500 1.15rem/1.3 var(--mono)}
.mybar .who{display:flex;gap:10px;align-items:center}
.chip{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:3px;background:var(--c);color:#fff;font:700 13px/1 var(--sans);flex:none}
.tabs{display:none;gap:3px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{flex:1;padding:7px;border:0;border-radius:6px;background:transparent;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.game-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,.75fr);gap:14px;align-items:start}
svg text{fill:var(--ink2);font-family:var(--sans)}
.hemi{width:100%;height:auto;display:block}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{font-size:.75rem;letter-spacing:.06em;font-weight:600;color:var(--ink2);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
.ptable th:first-child{text-align:left}
.ptable td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
.ptable td:first-child{text-align:left;overflow-wrap:anywhere}
.ptable tr.me td{font-weight:700}
.scroll{overflow-x:auto}
.ally{font-size:11px;color:var(--ink2);display:block;font-weight:400}
.reg{display:grid;gap:3px}
.reg-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar{display:flex;gap:2px;height:12px}
.bar i{display:block;background:var(--c);min-width:2px}
.bar i:first-child{border-radius:3px 0 0 3px}.bar i:last-child{border-radius:0 3px 3px 0}
.bill-title{font-size:1.05rem;font-weight:700}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600}
.vote[aria-pressed="true"]{border-color:var(--accent);background:var(--mine);color:var(--accent)}
.vote .stamp{font-size:24px;visibility:hidden}
.vote[aria-pressed="true"] .stamp{visibility:visible}
.slot{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px}
.slot.empty{border-style:dashed;color:var(--ink2);grid-template-columns:24px minmax(0,1fr)}
.slot .params{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:4px}
.slot select{padding:4px 6px;font-size:13px}
.x{border:0;background:transparent;font-size:18px;line-height:1;padding:4px 8px;color:var(--ink2)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.act{border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:left;padding:8px 10px;display:grid;gap:2px;align-content:start}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.deal{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.deal .row{gap:6px}
.deal-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost[aria-pressed="true"]{background:var(--mine);color:var(--accent);border-color:var(--accent)}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}
.bill-opts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.bill-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--mine)}
.bill-opt[aria-pressed="true"] b{color:var(--accent)}
.reg-seats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink2)}
.reg-seats span{display:inline-flex;align-items:center;gap:4px}
.reg-seats .me{color:var(--ink);font-weight:700}
.act b{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.act b em{font-style:normal;font-weight:500;color:var(--ink2);font-size:12px;white-space:nowrap}
.act span{font-size:12px;line-height:1.4;color:var(--ink2)}
.submit{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.news{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.news li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:baseline}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--line));display:inline-block}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.chat-log{display:grid;gap:8px;align-content:start;max-height:440px;min-height:120px;overflow-y:auto;font-size:14px}
.chat-msg{overflow-wrap:anywhere}
.chat-msg .from{font-weight:700;font-size:12px;display:flex;gap:5px;align-items:center}
.whisper{color:var(--warn);font-weight:500}
.chat-form{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.chat-form .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:30;max-width:90vw}
.overlay{position:fixed;inset:0;background:var(--shade);z-index:20;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:20px;width:min(640px,100%);display:grid;gap:14px;max-height:90vh;overflow:auto}
.big-stamp{font-size:40px;animation:thud .35s ease-out both}
@keyframes thud{from{transform:rotate(-9deg) scale(1.7)}to{transform:rotate(-9deg) scale(1)}}
.res-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.res-row strong{font-weight:700;overflow-wrap:anywhere}
.wrap.wide{max-width:1360px}
@media (max-width:1100px){
  .tabs{display:flex}
  .game-grid{grid-template-columns:minmax(0,1fr)}
  .game-grid>[data-col]{display:none}
  .game-grid>[data-col][data-on="1"]{display:grid}
  .mybar{grid-template-columns:repeat(5,minmax(0,1fr))}
  .mybar .who{grid-column:1/-1}
  .mybar>div{padding:6px 8px}
  .mybar .v{font-size:1rem}
}
@media (max-width:760px){
  .hero,.home-grid,.lobby-grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.big-stamp{animation:none}}
</style>
</head>

function makeLocalDb(ns){
  const key='party1:'+ns;let mem={};const subs=new Set();
  const load=()=>{try{const t=localStorage.getItem(key);if(t)mem=JSON.parse(t)}catch(e){}};
  const notify=()=>subs.forEach(f=>setTimeout(f,0));
  const save=()=>{try{localStorage.setItem(key,JSON.stringify(mem))}catch(e){}notify()};
  addEventListener('storage',e=>{if(e.key===key){load();notify()}});
  load();
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=path=>{const d=mem[path];return{id:path.split('/').pop(),exists:d!==undefined,data:()=>d===undefined?undefined:JSON.parse(JSON.stringify(d)),metadata:meta}};
  const doc=path=>({path,id:path.split('/').pop(),
    get:async()=>{load();return snap(path)},
    set:async d=>{load();mem[path]=JSON.parse(JSON.stringify(d));save()},
    update:async d=>{load();mem[path]=Object.assign(mem[path]||{},JSON.parse(JSON.stringify(d)));save()},
    delete:async()=>{load();delete mem[path];save()},
    acquire:async()=>({acquired:true}),
    onSnapshot:next=>{const f=()=>{load();next(snap(path))};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
  });
  const query=(path,o={})=>{
    const list=()=>{load();let ks=Object.keys(mem).filter(k=>k.startsWith(path+'/')&&!k.slice(path.length+1).includes('/'));
      let docs=ks.map(snap);
      if(o.by)docs.sort((a,b)=>((a.data()[o.by]||0)-(b.data()[o.by]||0))*(o.dir==='desc'?-1:1));
      if(o.n)docs=docs.slice(0,o.n);
      return{docs,size:docs.length,empty:!docs.length,metadata:meta}};
    return{path,doc:id=>doc(path+'/'+id),
      orderBy:(by,dir)=>query(path,{...o,by,dir}),limit:n=>query(path,{...o,n}),
      get:async()=>list(),
      onSnapshot:next=>{const f=()=>next(list());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}};
  };
  return{doc,collection:p=>query(p),removeGame(code){load();for(const k of Object.keys(mem))if(k==='games/'+code||k.startsWith('games/'+code+'/'))delete mem[k];save()}};
}

const HEMIS={};
function hemiPoints(total){
  if(HEMIS[total])return HEMIS[total];
  const n=Math.ceil(total/40)+1,step=200/(n-1);
  const rows=[];for(let i=0;i<n;i++)rows.push(110+i*step);
  const sum=rows.reduce((a,b)=>a+b,0);let left=total;const pts=[];
  rows.forEach((rad,i)=>{
    const c=i===rows.length-1?left:Math.round(total*rad/sum);left-=c;
    for(let j=0;j<c;j++){const t=Math.PI-(j+.5)/c*Math.PI;pts.push({x:360+rad*Math.cos(t),y:346-rad*Math.sin(t),t})}
  });
  pts.dot=Math.min(6.6,step*.36);
  return HEMIS[total]=pts.sort((a,b)=>b.t-a.t);
}
// ordered가 참이면 받은 순서 그대로 왼쪽부터 놓는다(연맹별 보기에서 연맹 회원을 붙여 놓을 때).
function hemicycle(parties,center,total,ordered){
  total=total||E.TOTAL;
  const pts=hemiPoints(total),pr=parties.reduce((a,p)=>a+p.pr,0);
  const sorted=ordered?parties.slice():parties.slice().sort((a,b)=>b.eco-a.eco||a.no-b.no);
  let i=0;
  const groups=sorted.map(p=>{
    const dots=pts.slice(i,i+p.seats);i+=p.seats;
    const c=pColor(p);
    return`<g><title>${esc(p.name)} ${p.seats}석${pr?` (지역구 ${p.district}, 비례 ${p.pr})`:''}</title>${dots.map((d,k)=>k<p.district
      ?`<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${pts.dot.toFixed(1)}" fill="${c}"/>`
      :`<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${(pts.dot*.82).toFixed(1)}" fill="none" stroke="${c}" stroke-width="2"/>`).join('')}</g>`;
  }).join('');
  return`<svg class="hemi" viewBox="0 0 720 360" role="img" aria-label="의석 배치: ${esc(sorted.map(p=>`${p.name} ${p.seats}석`).join(', '))}">${groups}
    <text x="360" y="288" text-anchor="middle" font-size="17" style="fill:var(--ink);font-weight:700">${esc(center||total+'석')}</text>
    <text x="360" y="312" text-anchor="middle" font-size="13">과반 ${Math.floor(total/2)+1}석</text>
    ${pr?`<text x="360" y="334" text-anchor="middle" font-size="13">● 지역구 ${total-pr} ○ 비례 ${pr}</text>`:''}</svg>`;
}
function pollChart(g){

}
function scoreChart(g){
  return trendChart(g,(g.history||[]).filter(x=>x.score),g.parties.filter(p=>!p.fixed),(x,p)=>x.score[p.id]||0,'점','첫 분기가 끝나면 승점 추이가 나타납니다.','분기별 승점 추이. 현재 값은 위 승점 현황 표에 있습니다.');
}
function trendChart(g,h,parties,val,unit,empty,label){
  if(h.length<2)return`<p class="small muted">${empty}</p>`;
  const W=420,H=170,L=34,R=12,T=8,B=22;
  let max=0,min=0;h.forEach(x=>parties.forEach(p=>{max=Math.max(max,val(x,p));min=Math.min(min,val(x,p))}));
  const step=unit==='%'?10:Math.max(10,Math.ceil((max-min)/40)*20);
  max=Math.max(10,Math.ceil(max/step)*step);min=Math.floor(min/step)*step;
  const X=i=>L+i/(h.length-1)*(W-L-R),Y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  const grid=[...new Set([min,0,max].concat(min<0?[]:[max/2]))].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="11">${v}${unit==='%'?'%':''}</text>`).join('');
  const xl=h.map((x,i)=>(i===0||i===h.length-1||(g.cycle?x.round%g.cycle===0:x.round===g.midRound))?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11">${x.round===0?'시작':x.round+'분기'}</text>`:'').join('');
  const lines=parties.map(p=>{
    const pts=h.map((x,i)=>[X(i),Y(val(x,p)),x]);
    const end=pts[pts.length-1];
    return`<g><polyline fill="none" stroke="${pColor(p)}" stroke-width="2" stroke-linejoin="round" points="${pts.map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ')}"/>
      ${pts.map(a=>`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="7" fill="transparent"><title>${esc(p.name)} ${a[2].round===0?'시작':a[2].round+'분기'}: ${val(a[2],p)}${unit}</title></circle>`).join('')}
      <circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="4" fill="${pColor(p)}" stroke="var(--card)" stroke-width="2"/></g>`;
  }).join('');
  return`<svg class="hemi" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}${xl}${lines}</svg>`;
}

const roomCountry=()=>S.game&&S.game.settings?S.game.settings.country||'':S.profile.country||'';
function takenPicks(){
  const t={};for(const m of Object.values(S.members)){if(m.uid!==S.me){const[k,v]=String(m.ideology).split(':');if(k==='pick')t[v]=1}}
  return t;
}
function myPick(country){
  const C=E.COUNTRIES[country],t=takenPicks();
  const ok=x=>x&&!x.fixed&&!t[x.id];
  const cur=C.parties.find(x=>x.id===S.profile.pick);
  return ok(cur)?cur:(C.parties.filter(ok).sort((a,b)=>b.seats-a.seats)[0]||C.parties[0]);
}
const poolOf=C=>C.parties.find(x=>x.fixed);
const isFounding=()=>S.profile.pick==='new';

  const C=E.COUNTRIES[country],t=takenPicks(),mine=myPick(country),pool=poolOf(C);

  const C=E.COUNTRIES[c];
  if(C)return`<li><b>${esc(C.name)} 정부 형태</b>: ${esc(C.systemNote)}${C.system==='presidential'||C.system==='semi'?' 대통령 선거는 중간 분기 말에 치릅니다.':''}</li>`;
  return'<li><b>의원내각제</b>: 첫 분기와 총선·해산·불신임 다음 분기에 의석수로 총리를 뽑습니다. 총리 당과 그 연대 상대가 여당입니다. 불신임이 가결되면 내각이 물러나고, 총리는 의회를 해산할 수 있습니다.</li>';
}

    <li><b>승점</b>: 여러 항목을 더합니다. 국회 탭의 승점 현황에서 언제든 볼 수 있습니다.<ul>
      <li>선거: 가상 공화국은 의석 1석당 ${E.PTS.seat/400}점(군소정당은 의회의 15%까지 1석당 +${E.PTS.minor/400}점 더), 국가 모드는 가진 1석당 ${E.PTS.share/400}점에 시작 의석에서 늘린 1석당 ${E.PTS.growth/400}점을 더합니다(의회의 ${E.PTS.growthMax*100}%까지, 줄면 감점). 의회 크기에 맞춰 조정합니다.</li>
      <li>입법: 우리 의원 법안 가결 +${E.PTS.ownLaw}(부결 ${E.PTS.ownFail}), 연립 합의 법안 가결 두 당 각 +${E.PTS.pactLaw}, 정부 법안 가결 집권당 +${E.PTS.govLaw}·연립 상대 +${E.PTS.partnerLaw}(부결 시 집권당 ${E.PTS.govFail}, 반대해서 막은 야당 각 +${E.PTS.block}), 불신임안 가결 시 발의 당 +${E.PTS.noconf}. 연립 합의 법안과 연립 상대 점수는 아래 표결 영향력만큼 받습니다.</li>
      <li>이념 실현: 누가 냈든 우리가 찬성해 법이 되면, 노선에 맞을 때 +${E.PTS.ideoHit}(아주 잘 맞으면 +${E.PTS.ideoHit+E.PTS.ideoStrong}), 노선에 어긋날 때 ${E.PTS.ideoMiss}. 노선에 어긋나는 법에 반대표를 던졌는데 통과되면 소신 점수 +${E.PTS.ideoStand}. 실용중도처럼 노선이 가운데인 당은 65% 이상 찬성으로 통과된 법에 찬성하면 +${E.PTS.ideoMid}. 가점은 표결 영향력만큼 받습니다: 의회의 10% 이상을 가진 당은 그대로, 그보다 작으면 줄어듭니다(최소 30%).</li>
      <li>집권·견제: 분기마다 집권당 +${E.PTS.pmRound}, 연립 상대 +${E.PTS.partnerRound}, 정부에 들지 않은 당 가운데 의석이 가장 많은 제1야당 +${E.PTS.oppRound}. 집권당은 대신 신뢰가 매 분기 깎이고 오래 집권할수록 표가 줄어듭니다. 제1야당은 정권 견제 여론으로 분기마다 표가 조금씩 붙습니다.</li>
      <li>정부: 끝났을 때 단독 과반 +${E.PTS.solo}, 연맹 합산 과반이면 그 당들 각 +${E.PTS.coalition}, 둘 다 없으면 원내 1당 +${E.PTS.minority}, 대통령제의 대통령 여당 +${E.PTS.president}, 이원집정부제의 대통령 당 +${E.PTS.semiPres}.</li>
      <li>신뢰·결속: 끝났을 때 신뢰가 50에서 1 오를 때마다 +${E.PTS.trust}, 결속은 +${E.PTS.unity}(내려가면 감점).</li>
    </ul></li>
  </ul>`}
function canResume(g,me,mode){
  if(g.status==='lobby')return mode==='solo'||Date.now()-(g.createdAt||0)<12*3600e3;
  return g.status==='playing'&&!!g.agenda&&!!g.parties[0].kind&&(g.playerIds||[]).includes(me);
}
function resumeRow(g,mode,me){
  const mine=g.parties&&g.parties.find(p=>p.ownerId===me);
  const cn=g.country||(g.settings&&g.settings.country);
  const stage=g.status==='lobby'?'시작 전 대기실':`${g.round} / ${g.maxRounds}분기`;
  const info=[mode==='solo'?'혼자 하기':`멀티 방 ${g.code}`,cn?`${E.COUNTRIES[cn].name} 모드`:'가상 공화국',stage].join(' · ');
  return`<div class="row between" style="padding:10px 12px;border:1px solid var(--line);border-radius:4px"><div style="min-width:0"><b style="overflow-wrap:anywhere">${esc(mine?mine.name:g.title||'이름 없는 정당')}</b><div class="small muted">${esc(info)}</div></div>
    <div class="row"><button class="btn" data-a="resume" data-mode="${mode}" data-v="${esc(g.code)}">이어하기</button><button class="btn ghost" data-a="${mode==='solo'?'discard':'forget'}" data-v="${esc(g.code)}">${mode==='solo'?'버리기':'목록에서 빼기'}</button></div></div>`;
}
async function renderResume(){
  const token=renderResume.n=(renderResume.n||0)+1;
  const rows=[];
  try{for(const d of(await S.local.collection('games').get()).docs){const g=d.data();if(canResume(g,'me','solo'))rows.push([g,'solo','me'])}}catch(e){}
  if(S.online&&S.onlineState==='on'){
    const me=S.onlineMe;
    await Promise.all(lsGet('party1:recent',[]).map(async c=>{
      try{
        const d=await S.online.doc('games/'+c).get();
        if(!d.exists){forgetRoom(c);return}
        const g=d.data();
        if(canResume(g,me,'online'))rows.push([g,'online',me]);
        else if(g.status==='over')forgetRoom(c);
      }catch(e){}
    }));
  }
  const box=$('#resume');
  if(token!==renderResume.n||!box)return;
  rows.sort((a,b)=>(b[0].createdAt||0)-(a[0].createdAt||0));
  box.hidden=!rows.length;
  box.innerHTML=`<h2>이어하기</h2><p class="small muted">하던 판을 저장했습니다. 저장은 이 브라우저에 연결되어 있어, 다른 기기나 시크릿 창에서는 보이지 않습니다.</p><div class="stack" style="gap:8px">${rows.map(r=>resumeRow(...r)).join('')}</div>`;
}
function renderRooms(){
  const box=$('#rooms'),note=$('#online-note');if(!box||!note)return;
  const create=$('#btn-create'),join=$('#btn-join');
  const off=!S.online||S.onlineState==='off';
  if(create)create.disabled=off||!S.canWrite;
  if(join)join.disabled=off;
  if(S.onlineState==='loading'){note.innerHTML='<p class="notice">멀티 서버에 연결하는 중입니다. 혼자 하기는 바로 시작할 수 있습니다.</p>';box.innerHTML='';return}
  if(off){note.innerHTML='<p class="notice">멀티 서버에 연결하지 못했습니다. 잠시 뒤 새로고침해 주세요. AI 정당과 혼자 하기는 그대로 됩니다.</p>';box.innerHTML='';return}
  note.innerHTML=S.canWrite?'':'<p class="notice">보기 권한이라 방을 관전만 할 수 있습니다. 참가하려면 게임 소유자에게 편집 초대를 요청하세요.</p>';
  const open=S.rooms.filter(g=>g.status==='lobby'&&Date.now()-(g.createdAt||0)<12*3600e3);
  const row=(g,label)=>`<button class="room" data-a="enter" data-v="${esc(g.code)}"><span><span class="code">${esc(g.code)}</span> <span class="small">${esc(g.title||'')}</span></span><span class="pill">${label}</span></button>`;
  if(!S.roomsLoaded){box.innerHTML='<p class="small muted">열린 방을 불러오는 중입니다.</p>';return}
  box.innerHTML=open.map(g=>row(g,'모집 중')).join('')||'<p class="small muted">아직 열린 방이 없습니다. 왼쪽에서 첫 방을 만들어 보세요.</p>';
}

/* ---------- 방 입장 ---------- */
function clearRoom(){S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[];Object.assign(S,{game:null,members:{},moves:{},chat:{},code:null,draft:null});clearTimeout(S.loadTimer)}
function goHome(){clearRoom();lsSet('party1:last',null);$('#modal').innerHTML='';renderHome()}
function requireProfile(){
  if(needsName()&&!S.profile.name.trim()){toast('정당 이름을 먼저 정해 주세요.');const i=$('#pf-name');if(i)i.focus();return false}
  return true;
}
const newCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';const u=new Uint32Array(4);crypto.getRandomValues(u);u.forEach(x=>c+=a[x%a.length]);return c};
// 혼자 하는 판은 끝난 것을 지우고, 진행 중인 판은 최근 5개까지 남긴다.
async function pruneSolo(){
  const all=(await S.local.collection('games').get()).docs.map(d=>d.data());
  all.filter(g=>g.status==='over').forEach(g=>S.local.removeGame(g.code));
  all.filter(g=>g.status!=='over').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(4).forEach(g=>S.local.removeGame(g.code));
}
async function createRoom(mode,prev){
  if(!prev&&!requireProfile())return;
  saveProfile();
  const store=mode==='solo'?S.local:S.online,me=mode==='solo'?'me':S.onlineMe;
  const old=prev?{code:S.code,msgs:(S.chat[me]&&S.chat[me].msgs)||[]}:null;
  const settings=prev||{rounds:12,size:5,timer:0,country:S.profile.country||''};
  S.profile.country=settings.country||'';
  clearRoom();
  if(mode==='solo')await pruneSolo();
  const code=newCode();
  try{
    await store.doc('games/'+code).set({code,status:'lobby',hostId:me,createdAt:Date.now(),title:partyTitle(),settings});
    // 끝난 판에 남은 사람들에게 새 방을 알린다. 끝난 판 문서는 규칙상 고칠 수 없어 내 대화 문서에 싣는다.
    if(old&&mode!=='solo')await store.doc(`games/${old.code}/chat/${me}`).set({msgs:old.msgs,rematch:code}).catch(()=>{});
    S.mode=mode;S.store=store;S.me=me;S.code=code;
    await store.doc(`games/${code}/members/${me}`).set({...memberBody(),joinedAt:Date.now()});
    subscribeRoom();
  }catch(e){toast(e&&(e.code==='quota_exceeded'||e.code==='resource-exhausted')?'오늘 서버 사용량이 가득 찼습니다. 내일 다시 시도해 주세요.':'방을 만들지 못했습니다. 잠시 뒤 다시 시도해 주세요.')}
}
async function enterRoom(code,mode='online'){
  code=String(code||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)){toast('방 코드는 영문과 숫자 4자리입니다.');return}
  const store=mode==='solo'?S.local:S.online,me=mode==='solo'?'me':S.onlineMe;
  const snap=await store.doc('games/'+code).get();
  if(!snap.exists){toast('그 코드의 방을 찾지 못했습니다.');return}
  const data=snap.data();
  clearRoom();
  S.mode=mode;S.store=store;S.me=me;S.code=code;
  if(data.status==='lobby'&&mode==='online'&&S.canWrite){
    const cn=data.settings&&data.settings.country||'';
    S.game=data;
    if(!cn&&!S.profile.name.trim()){S.profile.name=$('#pf-name')?$('#pf-name').value.trim():'';}
    if(!cn&&!S.profile.name.trim()){S.code=null;S.game=null;toast('참가하려면 정당 이름을 먼저 정해 주세요.');const i=$('#pf-name');if(i)i.focus();return}
    try{const ms=await store.collection(`games/${code}/members`).get();S.members=Object.fromEntries(ms.docs.map(d=>[d.id,d.data()]));const mine=await store.doc(`games/${code}/members/${me}`).get();
      await store.doc(`games/${code}/members/${me}`).set({...memberBody(),joinedAt:mine.exists?mine.data().joinedAt:Date.now()})}
    catch(e){S.canWrite=false;toast('참가 권한이 없어 관전으로 들어갑니다.')}
  }
  subscribeRoom();
}
const forgetRoom=code=>lsSet('party1:recent',lsGet('party1:recent',[]).filter(c=>c!==code));
function subscribeRoom(){
  const{code,store}=S;
  lsSet('party1:last',{mode:S.mode,code});
  if(S.mode==='online')lsSet('party1:recent',[code,...lsGet('party1:recent',[]).filter(c=>c!==code)].slice(0,10));
  S.screen='loading';
  $('#app').innerHTML='<p class="muted" style="padding:40px 0" id="loading">방을 여는 중입니다.</p>';
  S.loadTimer=setTimeout(()=>{const l=$('#loading');if(l)l.textContent='서버 응답이 늦어지고 있습니다. 연결되면 자동으로 이어집니다.'},10000);
  S.unsub.push(store.doc('games/'+code).onSnapshot(snap=>{
    if(!snap.exists){
      if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites){toast('방이 닫혔습니다.');goHome()}
      return;
    }
    clearTimeout(S.loadTimer);
    onGame(snap.data());
  },dbErr));
  S.unsub.push(store.collection(`games/${code}/members`).onSnapshot(s=>{
    S.members=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));
    if(S.screen==='lobby')renderLobbyList();
  },dbErr));
  S.unsub.push(store.collection(`games/${code}/moves`).onSnapshot(s=>{
    S.moves=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));
    syncDraftFromMoves();
    if(S.screen==='game')renderWaiting();
    tryResolve(false);
  },dbErr));
  S.unsub.push(store.collection(`games/${code}/chat`).onSnapshot(s=>{
    S.chat=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));
    renderChat();renderRematch();renderDeals();
  },dbErr));
}
function dbErr(e){if(e&&e.code!=='revoked')toast('서버 연결이 끊겼습니다. 페이지를 다시 열어 주세요.')}
function onGame(g){
  const prevRound=S.game&&S.game.round,prevStatus=S.game&&S.game.status;
  const prevCountry=S.game&&S.game.settings?S.game.settings.country||'':null;
  S.game=g.parties?E.normAllies(g):g;
  E.useMap({country:g.country||(g.settings&&g.settings.country)||null});
  if(g.status==='over'&&prevStatus==='playing')setTab('decide');
  if(g.status==='lobby'){
    const cn=g.settings.country||'';
    if(S.screen!=='lobby'||(prevCountry!==null&&prevCountry!==cn)){mountLobby();if(S.members[S.me])pushProfile()}else renderLobbySettings();
    renderLobbyList();
    return;
  }
  if(g.status==='playing'&&(!g.agenda||!g.parties[0].kind)){toast('규칙이 바뀌기 전에 시작한 판이라 이어 할 수 없습니다.');goHome();return}
  if(S.screen!=='game'){mountGame();ensureDraft();renderGameAll();maybeElection();return}
  if(prevRound!==g.round||prevStatus!==g.status){ensureDraft();renderGameAll();maybeElection()}
  else{renderTop();renderWaiting()}
}

function renderHouse(){
  const g=S.game,me=myParty();const nat=E.nationalShares(g);
  const ps=g.parties.slice().sort((a,b)=>b.seats-a.seats||a.no-b.no);
  const shares=E.REGIONS.map(r=>[r,E.regionShares(g,r)]);
  const order=g.parties.slice().sort((a,b)=>b.eco-a.eco||a.no-b.no);
  // 지금 총선을 치르면 나올 의석. 재보궐·총선 계산과 같은 식이다.
  const fc=E.electionSeats(g);const fcReg=Object.fromEntries(fc.regions.map(x=>[x.id,x.seats]));
  const fcTotal=p=>fc.district[p.id]+(E.PR?fc.pr[p.id]:0);

  const bsum=(b,fn)=>b.ps.reduce((n,p)=>n+fn(p),0);
  const bEco=b=>bsum(b,p=>p.eco*Math.max(p.seats,1))/bsum(b,p=>Math.max(p.seats,1));
  const fedSeatOrder=blocs.slice().sort((a,b)=>bEco(b)-bEco(a)||a.ps[0].no-b.ps[0].no).flatMap(b=>b.ps.slice().sort((x,y)=>y.eco-x.eco||x.no-y.no));
  const majority=Math.floor(E.TOTAL/2)+1;
  const myFed=me?E.fedOf(g,me):null;

  const fedTable=()=>{
    const rows=blocs.slice().sort((a,b)=>bsum(b,p=>p.seats)-bsum(a,p=>p.seats)||a.ps[0].no-b.ps[0].no).map(b=>{
      const seats=bsum(b,p=>p.seats),fcs=bsum(b,fcTotal),mine=me&&b.ps.includes(me);

        :`${chip(b.ps[0])} ${esc(b.ps[0].name)}<span class="ally">연맹 없음</span>`;
      return`<tr class="${mine?'me':''}"><td>${name}</td><td>${seats}</td>${E.PR?`<td>${bsum(b,p=>p.district)}·${bsum(b,p=>p.pr)}</td>`:''}<td>${fcs}${fcs!==seats?` <span class="small muted">${fmtD(fcs-seats)}</span>`:''}</td><td>${(bsum(b,p=>nat[p.id])*100).toFixed(1)}%</td><td>${seats>=majority?'<b>과반</b>':`${majority-seats}석 부족`}</td></tr>`}).join('');
    return`<div class="scroll"><table class="ptable"><thead><tr><th>연맹</th><th>의석</th>${E.PR?'<th>지역·비례</th>':''}<th>총선 예상</th><th>정당 득표</th><th>과반까지</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${(g.feds||[]).length?'':'<p class="small muted">아직 결성된 연맹이 없습니다.</p>'}`;
  };
  const regSeats=r=>{const a=fcReg[r.id];return`<div class="reg-seats">${g.parties.filter(p=>a[p.id]>0).sort((x,y)=>a[y.id]-a[x.id]||x.no-y.no).map(p=>`<span class="${me&&p.id===me.id?'me':''}"><i class="dot" style="--c:${pColor(p)}"></i>${esc(p.name)} ${a[p.id]}</span>`).join('')}</div>`};
  $('#col-house').innerHTML=`
  <section class="panel"><div class="row between"><h2>${g.country?esc(E.COUNTRIES[g.country].house):'국회'}</h2>${viewBtns}</div>${view==='fed'
      ?hemicycle(fedSeatOrder,myFed?`${myFed.name} ${E.fedSeats(g,myFed)}석`:me?`${me.name} ${me.seats}석`:E.TOTAL+'석',0,true)+fedTable()
      :hemicycle(g.parties,me?`${me.name} ${me.seats}석`:E.TOTAL+'석')+`

function dealTerms(g,d){

    ${incHtml?`<h3>받은 제안</h3>${incHtml}`:''}

function billPickHtml(g,me){

  const seats=E.REGIONS.reduce((s,x)=>s+x.seats,0);
  const opts=g.billOptions.map(i=>{

    const lean=E.REGIONS.reduce((s,x)=>s+E.billAlign(b,x)*x.seats,0)/seats;
    const passTxt=Object.entries(b.pass).map(([k,v])=>`${E.REG[k].name} ${fmtD(v)}`).join(', ');
    return`<button class="act bill-opt" data-a="bill" data-v="${i}" aria-pressed="${i===pick}"><b>${esc(b.title)}<em>${a>.2?'우리 노선':a<-.2?'노선과 반대':'중립'}</em></b><span>${esc(b.desc)}</span><span class="small muted">여론 ${lean>.1?'호의적':lean<-.1?'비판적':'엇갈림'} · 가결 시 ${esc(passTxt)}</span></button>`;
  }).join('');
  return`<section class="panel"><h2>다음 분기 ${name}</h2>
    <p class="small muted">${g.round+1}분기 본회의에 올릴 ${name}을 고릅니다. 고르지 않으면 우리 노선에 가장 맞는 안이 올라갑니다. 분기 말에 정부가 바뀌면 새 정부가 다시 고릅니다.</p>

}

function paramSel(g,me,a,i,attr){
  const others=a.type==='expel'?E.allies(me).map(id=>E.party(g,id)):g.parties.filter(p=>p.id!==me.id);
  const region=()=>`<select ${attr}="region" data-i="${i}" aria-label="지역">${E.REGIONS.map(r=>`<option value="${r.id}" ${r.id===a.region?'selected':''}>${r.name} ${r.seats}석 (${(E.regionShares(g,r)[me.id]*100).toFixed(0)}%)</option>`).join('')}</select>`;
  const target=()=>`<select ${attr}="target" data-i="${i}" aria-label="대상 정당">${others.map(p=>`<option value="${p.id}" ${p.id===a.target?'selected':''}>${p.no}번 ${esc(p.name)}</option>`).join('')}</select>`;
  const topic=()=>`<select ${attr}="topic" data-i="${i}" aria-label="정책 분야">${Object.entries(E.TOPICS).map(([k,t])=>`<option value="${k}" ${k===a.topic?'selected':''}>${t.label}</option>`).join('')}</select>`;
  const title=()=>`<input ${attr}="title" data-i="${i}" maxlength="24" aria-label="법안 이름" placeholder="법안 이름" value="${esc(a.title||'')}">`;
  const map={region,target,topic,title};
  return n=>map[n]();
}
function govActionsHtml(g,me){

    `<button class="act" data-a="gadd" data-v="${k}" ${full||E.govCost(k)>left||d.gov.some(x=>x.type==='dissolve'&&k==='dissolve')?'disabled':''}><b>${v.label}<em>${v.cost?'국고 '+money(E.govCost(k)):'무료'}</em></b><span>${v.desc}</span></button>`).join('');
  return`<section class="panel"><div class="row between"><h2>${isPm?`${headTitle(g)} 행정`:g.system==='semi'&&g.presParty===me.id?'대통령 권한':'연립 행정'}</h2><span class="pill">남는 국고 ${money(left)}</span></div>
    <p class="small muted">일반 행동과 별도로 ${slots}건 집행합니다. 비용은 국고에서 나갑니다.</p>
    <div class="stack" style="gap:6px">${rows.join('')}</div><div class="acts">${pal}</div></section>`;

function actionsHtml(g,me){
  const d=S.draft;const left=remainingFunds(me);
  const slots=[];
  for(let i=0;i<E.AP;i++){
    const a=d.actions[i];
    if(!a){slots.push(`<div class="slot empty"><b>${i+1}</b><span class="small">아래에서 행동을 고르세요.</span></div>`);continue}
    const def=E.ACTIONS[a.type];const sel=paramSel(g,me,a,i,'data-param');
    const lv=a.level==null?2:a.level;
    const others=d.actions.reduce((sum,x,j)=>j===i?sum:sum-E.actionCost(x)+(x.type==='fundraise'?E.fundGain(me):0),me.funds);
    const lvSel=def.spend?`<select data-param="level" data-i="${i}" aria-label="지출 규모">${E.LEVELS.map((l,n)=>{const c=E.actionCost({type:a.type,level:n});return`<option value="${n}" ${n===lv?'selected':''} ${c>others?'disabled':''}>${l.name} ${money(c)} (효과 ×${l.effect})</option>`}).join('')}</select>`:'';
    const params=lvSel+def.need.map(sel).join('');
    slots.push(`<div class="slot"><b>${i+1}</b><div style="min-width:0"><b>${def.label}</b> <span class="small muted">${a.type==='fundraise'?'+'+money(E.fundGain(me)):def.cost?money(E.actionCost(a)):'무료'}</span>${params?`<div class="params">${params}</div>`:''}</div><button class="x" data-a="rm" data-v="${i}" aria-label="${def.label} 빼기">×</button></div>`);
  }
  const full=d.actions.length>=E.AP;
  const myFed=E.fedOf(g,me);
  const pal=Object.entries(E.ACTIONS).filter(([k])=>k==='leaveFed'?!!myFed&&!d.actions.some(x=>x.type==='leaveFed'):k==='expel'?!!myFed&&myFed.head===me.id:true)
    .filter(([k])=>k!=='noConfidence'||(g.pmParty&&!E.inGov(g,me)&&g.system!=='presidential'))
    .map(([k,v])=>`<button class="act" data-a="add" data-v="${k}" ${full||E.actionCost({type:k,level:v.spend?0:2})>left?'disabled':''}><b>${v.label}<em>${k==='fundraise'?'+'+money(E.fundGain(me)):v.cost?(v.spend?money(E.actionCost({type:k,level:0}))+'부터':money(E.actionCost({type:k}))):'무료'}</em></b><span>${v.desc}</span></button>`).join('');
  return`<section class="panel"><div class="row between"><h2>이번 분기 행동</h2><span class="pill">남는 자금 ${money(left)}</span></div>
    <div class="stack" style="gap:6px">${slots.join('')}</div>
    <div class="acts">${pal}</div></section>`;
}
function draftMissing(){

function scoreLine(g,x){
  if(x.elec==null)return x.startSeats!=null?`${x.startSeats}석에서 ${x.seats}석`:`${x.seats}석`;

  const part=(n,t)=>n?`${t} ${n>0?'+':'−'}${Math.abs(n)}`:'';

/* ---------- 결정 제출과 분기 처리 ---------- */
async function submitMove(){
  const d=S.draft;if(!d||draftMissing())return;
  const body={round:S.game.round,votes:d.votes,pm:d.pm||null,actions:d.actions,gov:d.gov,bill:Number.isInteger(d.bill)?d.bill:null,at:Date.now()};
  d.submitted=true;d.dirty=false;d.touched=true;
  renderWaiting();
  try{await S.store.doc(`games/${S.code}/moves/${S.me}`).set(body)}
  catch(e){d.submitted=false;renderWaiting();toast('제출하지 못했습니다. 다시 눌러 주세요.')}
}
async function tryResolve(force){
  const g=S.game;if(!g||g.status!=='playing'||S.resolving)return;
  if(!myParty())return;
  const humans=g.parties.filter(p=>!p.bot);
  const all=humans.every(p=>S.moves[p.ownerId]&&S.moves[p.ownerId].round===g.round);
  const late=g.deadline&&Date.now()>g.deadline;
  if(!all&&!late&&!force)return;
  S.resolving=true;S.lastTry=Date.now();
  try{
    const ref=roomRef();
    const lease=await ref.acquire({holder:S.me,ttlMs:6000});
    if(!lease.acquired)return;
    const fresh=(await ref.get()).data();
    if(!fresh||fresh.status!=='playing'||fresh.round!==g.round)return;
    const ms=await S.store.collection(`games/${S.code}/moves`).get();
    const moves=Object.fromEntries(ms.docs.map(x=>[x.id,x.data()]));
    const cs=await S.store.collection(`games/${S.code}/chat`).get();
    const talk=Object.fromEntries(cs.docs.map(x=>[x.id,x.data()]));
    await ref.set(E.resolveRound(fresh,moves,Date.now(),talk));
  }catch(e){if(force)toast('처리하지 못했습니다. 다시 눌러 주세요.')}
  finally{S.resolving=false}
}
// 끝난 판을 한 임기 더 잇는다. 여러 사람이 동시에 눌러도 한 번만 처리한다.
async function continueTerm(){
  const g=S.game;if(!g||g.status!=='over'||!myParty()||S.resolving)return;
  S.resolving=true;
  try{
    const ref=roomRef();
    const lease=await ref.acquire({holder:S.me,ttlMs:6000});
    if(!lease.acquired)return;
    const fresh=(await ref.get()).data();
    if(!fresh||fresh.status!=='over')return;
    await ref.set(E.continueGame(fresh,Date.now()));
  }catch(e){toast('이어 가지 못했습니다. 다시 눌러 주세요.')}
  finally{S.resolving=false}
}
setInterval(()=>{
  const g=S.game;if(!g||S.screen!=='game'||g.status!=='playing')return;
  const t=$('#timer');
  if(t){
    if(g.deadline){const s=Math.max(0,Math.ceil((g.deadline-Date.now())/1000));t.hidden=false;t.textContent=`남은 시간 ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
    else t.hidden=true;
  }
  if(Date.now()-S.lastTry>4000)tryResolve(false);
},1000);

/* ---------- 협상 채널 ---------- */
function chatShell(){return`<div class="chat-log" id="chat-log" aria-live="polite"></div>
  ${S.mode&&(S.game&&myParty()||S.members[S.me]||(S.game&&S.game.status==='lobby'&&isHost()))?`<form class="chat-form" id="chat-form"><select id="chat-to" aria-label="받는 정당"><option value="">전체 공개</option></select><div class="line"><input id="chat-input" maxlength="200" autocomplete="off" placeholder="연대를 제안해 보세요" aria-label="메시지"><button class="btn">보내기</button></div></form>`:''}`}
function senderName(uid){
  const p=S.game&&S.game.parties&&S.game.parties.find(x=>x.ownerId===uid);
  if(p)return{name:p.name,color:pColor(p),id:p.id};
  const m=S.members[uid];return{name:m&&m.name||'이름 없는 정당',color:m?memberColor(m):'var(--line)',id:null};
}
function renderChat(){
  const log=$('#chat-log');if(!log)return;
  const mine=myParty();
  const sel=$('#chat-to');
  if(sel&&S.game&&S.game.parties&&sel.options.length<=1){
    S.game.parties.filter(p=>!p.bot&&p.ownerId!==S.me).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.name}에게만`;sel.append(o)});
  }
  const all=[];
  for(const uid in S.chat){for(const m of(S.chat[uid].msgs||[])){
    if(m.to&&!(uid===S.me||(mine&&m.to===mine.id)))continue;
    all.push({...m,uid});
  }}
  all.sort((a,b)=>a.t-b.t);
  const stick=log.scrollHeight-log.scrollTop-log.clientHeight<60;
  log.innerHTML=all.length?all.slice(-80).map(m=>{const s=senderName(m.uid);const to=m.to&&S.game.parties?E.party(S.game,m.to):null;
    return`<div class="chat-msg"><div class="from"><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}${to?` <span class="whisper">→ ${esc(to.name)} 귓속말</span>`:''}</div>${esc(m.text)}</div>`}).join(''):'<p class="small muted">아직 메시지가 없습니다. 연대 약속은 여기서 잡습니다.</p>';
  if(stick)log.scrollTop=log.scrollHeight;
}
async function sendChat(text,to){
  text=text.trim().slice(0,200);if(!text)return;
  const ref=S.store.doc(`games/${S.code}/chat/${S.me}`);
  const msgs=((S.chat[S.me]&&S.chat[S.me].msgs)||[]).concat({t:Date.now(),text,to:to||null}).slice(-40);
  const body={...(S.chat[S.me]||{}),msgs};
  S.chat[S.me]=body;renderChat();
  try{await ref.set(body)}catch(e){toast('메시지를 보내지 못했습니다.')}
}

/* ---------- 입력 처리 ---------- */
function touchDraft(){const d=S.draft;d.touched=true;if(d.submitted)d.dirty=true}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const v=b.dataset.v;
  switch(b.dataset.a){
    case'ideo':S.profile.ideology=v;document.querySelectorAll('[data-a=ideo]').forEach(x=>x.setAttribute('aria-pressed',x===b));pushProfile();break;
    case'country':S.profile.country=v;saveProfile();renderHome();break;
    case'pick':if(S.profile.pick!==v){S.profile.cname='';S.profile.cideo=''}S.profile.pick=v;document.querySelectorAll('[data-a=pick]').forEach(x=>x.setAttribute('aria-pressed',x===b));{const o=$('#party-opts');if(o)o.innerHTML=partyOptsHtml(roomCountry())}pushProfile();break;
    case'rematch':createRoom(S.mode,{...S.game.settings});break;
    case'continue':continueTerm();break;
    case'join-rematch':enterRoom(v,S.mode);break;
    case'kind':S.profile.kind=v;document.querySelectorAll('[data-a=kind]').forEach(x=>x.setAttribute('aria-pressed',x===b));pushProfile();break;
    case'color':S.profile.colorIdx=+v;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',x===b));pushProfile();break;
    case'create':createRoom('online');break;
    case'solo':createRoom('solo');break;
    case'enter':enterRoom(v);break;
    case'start':startGame();break;
    case'leave':
      if(isHost()){const c=S.code,st=S.store;const ids=Object.keys(S.members);clearRoom();lsSet('party1:last',null);renderHome();try{await Promise.all(ids.map(i=>st.doc(`games/${c}/members/${i}`).delete()));await st.doc('games/'+c).delete()}catch(e){}}
      else{const c=S.code,st=S.store,me=S.me;forgetRoom(c);clearRoom();lsSet('party1:last',null);renderHome();try{await st.doc(`games/${c}/members/${me}`).delete()}catch(e){}}
      break;
    case'exit':{
      const playing=S.game&&S.game.status==='playing',solo=S.mode==='solo';
      goHome();
      if(playing)toast(solo?'저장했습니다. 첫 화면의 이어하기에서 계속할 수 있습니다.':'나가도 판은 이어집니다. 첫 화면의 이어하기로 돌아오세요.');
      break;
    }
    case'resume':enterRoom(v,b.dataset.mode);break;
    case'forget':forgetRoom(v);renderResume();break;
    case'discard':
      if(b.dataset.sure){S.local.removeGame(v);renderResume()}
      else{b.dataset.sure='1';b.textContent='정말 버리기'}
      break;
    case'tab':setTab(v);break;
    case'house-view':S.houseView=v==='fed'?'fed':'party';try{localStorage.setItem('jd-house-view',S.houseView)}catch(e){}renderHouse();break;
    case'vote':S.draft.votes[b.dataset.id]=v;touchDraft();renderDecide();break;
    case'add':{
      const me=myParty();const def=E.ACTIONS[v];const a={type:v};
      if(def.spend){const left=remainingFunds(me);a.level=[2,1,0].find(l=>E.actionCost({type:v,level:l})<=left)??0}
      if(def.need.includes('region'))a.region=E.REGIONS.slice().sort((x,y)=>y.seats*E.fit(me,y)-x.seats*E.fit(me,x))[0].id;
      if(def.need.includes('target'))a.target=v==='expel'?E.allies(me).find(id=>!S.draft.actions.some(x=>x.type==='expel'&&x.target===id))||E.allies(me)[0]:S.game.parties.filter(p=>p.id!==me.id&&!E.isAlly(me,p.id)).sort((x,y)=>y.seats-x.seats)[0].id;
      if(v==='propose'){a.topic=Object.keys(E.TOPICS).sort((x,y)=>E.billAlign(E.TOPICS[y],me)-E.billAlign(E.TOPICS[x],me))[0];a.title=E.TOPICS[a.topic].title}
      S.draft.actions.push(a);touchDraft();renderDecide();break;
    }
    case'gadd':{
      const me=myParty();const a={type:v};
      if(E.GOV[v].need.includes('region'))a.region=E.REGIONS.slice().sort((x,y)=>y.seats*E.fit(me,y)-x.seats*E.fit(me,x))[0].id;
      if(E.GOV[v].need.includes('target'))a.target=S.game.parties.filter(p=>p.id!==me.id&&!E.isAlly(me,p.id)).sort((x,y)=>y.seats-x.seats)[0].id;
      S.draft.gov.push(a);touchDraft();renderDecide();break;
    }
    case'grm':S.draft.gov.splice(+v,1);touchDraft();renderDecide();break;
    case'bill':S.draft.bill=+v;touchDraft();renderDecide();break;
    case'deal-reply':{const k=b.dataset.k;const rep={...(myTalk().replies||{})};rep[k]=rep[k]===v?null:v;if(!rep[k])delete rep[k];saveTalk({replies:rep});break}
    case'deal-counter':{
      // 받은 조건을 우리 쪽에서 본 모양으로 뒤집어 고칠 수 있게 채운다.
      let t={};try{t=JSON.parse(b.dataset.terms)}catch(e){}
      S.dealDraft={round:S.game.round,code:S.code,to:b.dataset.from,pm:flip(t.pm),topic:t.topic||'',yieldReg:t.yieldReg||'',yieldBy:flip(t.yieldBy)||'from',endorse:flip(t.endorse),name:t.name||''};renderDeals();
      const el=$('#deal-to');if(el)el.focus();break;
    }
    case'deal-fix':{let t={};try{t=JSON.parse(b.dataset.terms)}catch(e){}
      S.dealDraft={round:S.game.round,code:S.code,to:b.dataset.to,pm:t.pm||'',topic:t.topic||'',yieldReg:t.yieldReg||'',yieldBy:t.yieldBy||'from',endorse:t.endorse||'',name:t.name||(S.dealDraft&&S.dealDraft.name)||''};renderDeals();break}
    case'deal-send':{
      const g=S.game,d=S.dealDraft;if(!d||!d.to)break;
      const deals=(myTalk().deals||[]).filter(x=>x&&x.round===g.round&&x.to!==d.to);
      deals.push({id:Date.now().toString(36),round:g.round,to:d.to,...termsOf(d)});
      saveTalk({deals});toast(E.party(g,d.to).bot?'제안을 냈습니다. AI의 답은 아래에 보입니다.':'제안을 보냈습니다. 상대 화면에 바로 뜹니다.');break;
    }
    case'deal-withdraw':saveTalk({deals:(myTalk().deals||[]).filter(x=>x&&x.id!==v)});break;
    case'rm':S.draft.actions.splice(+v,1);touchDraft();renderDecide();break;
    case'submit':submitMove();break;
    case'force':tryResolve(true);break;
    case'close-modal':$('#modal').innerHTML='';break;
    case'guide-off':lsSet('party1:guide-off',true);renderDecide();break;
  }
});

document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='pf-cideo'){S.profile.cideo=t.value;if(isFounding()){const o=$('#party-opts');if(o)o.innerHTML=partyOptsHtml(roomCountry())}pushProfile();return}
  if(t.dataset.set&&isHost()){
    try{await roomRef().update({settings:{...S.game.settings,[t.dataset.set]:t.dataset.set==='country'?t.value:+t.value}})}catch(e){toast('설정을 저장하지 못했습니다.')}
  }else if(t.dataset.param){
    const a=S.draft.actions[+t.dataset.i];const prevTopic=a.topic;
    a[t.dataset.param]=t.dataset.param==='level'?+t.value:t.value;
    if(t.dataset.param==='level'){touchDraft();renderDecide();return}
    // 기본 이름을 그대로 둔 법안은 분야를 바꾸면 이름도 따라간다.
    if(t.dataset.param==='topic'&&a.title===E.TOPICS[prevTopic].title){a.title=E.TOPICS[a.topic].title;touchDraft();renderDecide();return}
    touchDraft();renderWaiting();
  }else if(t.dataset.gparam){
    S.draft.gov[+t.dataset.i][t.dataset.gparam]=t.value;touchDraft();renderWaiting();
  }else if(t.id==='deal-to'||t.dataset.deal){
    const d=S.dealDraft;if(!d)return;
    if(t.id==='deal-to')d.to=t.value;else d[t.dataset.deal]=t.value;
    renderDeals();
  }else if(t.dataset.pm){
    S.draft.pm=t.value;touchDraft();renderWaiting();
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='join-form')enterRoom($('#join-code').value);
  if(ev.target.id==='chat-form'){const i=$('#chat-input');sendChat(i.value,$('#chat-to').value);i.value=''}
});

/* ---------- 시작 ---------- */
async function connectOnline(){
  if(!window.claude||!window.claude.use){
    // 사이트: Firebase. ?local 을 붙이면 탭끼리 공유하는 저장소로 멀티를 흉내 낸다.
    if(!/[?&]local\b/.test(location.search))return(await import('./firestore-store.js')).connect();
    let id=null;try{id=sessionStorage.getItem('party1:tab');if(!id){id='tab'+Math.random().toString(36).slice(2,8);sessionStorage.setItem('party1:tab',id)}}catch(e){id='tab'+Math.random().toString(36).slice(2,8)}
    return{db:makeLocalDb('dev'),id,canWrite:true};
  }
  const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return null;
  const id=await user.id();if(!id)return null;
  const can=await user.can('data.write');
  return{db,id,canWrite:can!==false};
}
function watchRooms(){
  const t=setTimeout(()=>{if(!S.roomsLoaded&&S.screen==='home'){const b=$('#rooms');if(b)b.innerHTML='<p class="small muted">방 목록 응답이 늦어지고 있습니다. 코드를 직접 입력해도 됩니다.</p>'}},10000);
  S.online.collection('games').orderBy('createdAt','desc').limit(30).onSnapshot(s=>{
    S.rooms=s.docs.map(d=>d.data());
    if(!s.metadata.fromCache){S.roomsLoaded=true;clearTimeout(t)}
    if(s.docs.length)S.roomsLoaded=true;
    if(S.screen==='home')renderRooms();
  },()=>{clearTimeout(t);S.onlineState='off';if(S.screen==='home')renderRooms()});
}
async function boot(){
  renderHome();
  const last=lsGet('party1:last',null);
  if(last&&last.mode==='solo'){
    const s=await S.local.doc('games/'+last.code).get();
    if(s.exists&&s.data().status!=='over'){S.mode='solo';S.store=S.local;S.me='me';S.code=last.code;subscribeRoom()}
  }
  let on=null;try{on=await connectOnline()}catch(e){}
  if(!on){S.onlineState='off';if(S.screen==='home')renderRooms();return}
  S.online=on.db;S.onlineMe=on.id;S.canWrite=on.canWrite;S.onlineState='on';
  if(S.screen==='home'){renderRooms();renderResume()}
  watchRooms();
  if(last&&last.mode==='online'&&S.screen==='home'){
    try{const s=await S.online.doc('games/'+last.code).get();
      if(s.exists&&s.data().status!=='over'&&S.screen==='home'){S.mode='online';S.store=S.online;S.me=S.onlineMe;S.code=last.code;subscribeRoom()}}catch(e){}
  }
}
boot();
}
